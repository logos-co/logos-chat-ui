<script id="report-data" type="application/json">{"generated_platform": "Linux", "summary": {"passed": 4, "failed": 0, "skipped": 0}, "tutorials": [{"meta": {"name": "Tutorial: The Logos Chat UI", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"md": "# Tutorial: The Logos Chat UI\n\n`chat_ui` is a Logos **UI module**: a QML view backed by a small C++ class\n(the *universal* typed-backend authoring model) that drives the Rust\n`chat_module` \u2014 end-to-end-encrypted conversations carried over\n`delivery_module`. You write a `.rep` view contract and a `*Backend` deriving\n`LogosUiPluginContext`; the plugin glue, the typed `modules().chat_module`\ncaller, and the QtRO wiring are generated.\n\nThis tour builds the app, watches it connect to the network, and shares your\naddress (what a peer needs to start a conversation with you).\n\n> **The two-party exchange has its own tutorial.** A message exchange is\n> inherently two-party, so it gets its own walkthrough \u2014 *Run the automated\n> message-exchange test* \u2014 which drives the real round-trip between two windows\n> and shows the result, with the step-by-step flow in\n> [docs/two-instance-exchange.md](../docs/two-instance-exchange.md). This\n> tutorial covers everything a single window shows: connecting, and sharing\n> your own address.\n\n**What you'll build:** A running Logos chat app, connected to the network and sharing your address from the GUI.\n\n**What you'll learn:**\n\n- How a `type: ui_qml`, `interface: universal` module is built and run\n- The connection lifecycle: init is non-blocking and the UI goes Online when delivery connects\n- Sharing your address \u2014 what a peer needs to open an encrypted conversation with you\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, Rust) during the builds.\n- **Network access.** The two delivery nodes discover each other over the configured network preset; an isolated sandbox won't complete the exchange.", "execs": []}, {"md": "## Step 1: Build the chat UI\n\nThe module builds with the standard `mkLogosQmlModule` flake output \u2014\n`chat_ui_plugin.so` (the C++ backend + generated glue) and\n`chat_ui_replica_factory.so` (the QtRO replica for the QML view).", "execs": []}, {"md": "### 1.1 Build the plugin\n\n```bash\nnix build 'github:logos-co/logos-chat-ui'\n```\n\nThe build runs the universal UI codegen (`logos-qt-generator --backend\nui`) over `src/ChatBackend.rep`, compiles `ChatBackend` (which derives\n`ChatBackendSimpleSource` + `LogosUiPluginContext`), and emits the\n`chat_ui_plugin` / replica-factory glue around it.", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-chat-ui/ec54b37e9ef1a96b737afd8ec65c106c04e6449f' -o result", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "## What the chat UI does\n\nThe window is a two-pane messenger:\n\n- **Left:** your conversations, a `Chat` header with a connection dot,\n  a **New** button (start a conversation from someone's address), and a\n  **Show My Address** button (share your own).\n- **Right:** the message thread for the selected conversation and a\n  composer (the **Send** button).\n- **Status bar:** a human-readable status, the delivery state\n  (`Stopped` \u2192 `Initialising...` \u2192 `Online`), and your installation `ID`.\n\nUnder the hood the backend calls `modules().chat_module` \u2014 typed methods\n(`init`, `get_address`, `create_conversation`, `send_message`, \u2026)\nand string-keyed event subscriptions (`message_received`,\n`delivery_state_changed`, \u2026) that push updates into the view with no\npolling. `init` kicks off the delivery node asynchronously and returns\nimmediately; the UI flips to **Online** when the\n`delivery_state_changed` event reports the network is up.", "execs": []}, {"md": "## Step 2: Launch and connect, then share your address\n\nRun the app headless (offscreen Qt) and drive it: wait for the network to\ncome up, then open and copy your address \u2014 the everything-a-single-\nwindow-shows half of the tour.", "execs": []}, {"md": "### 2.1 Drive the app\n\n```bash\nnix run 'github:logos-co/logos-chat-ui/ec54b37e9ef1a96b737afd8ec65c106c04e6449f'\n```\n\nThe chat window opens; the status bar starts at **Stopped** while delivery boots.\n\n`init` returned right away and the delivery node bootstrapped in\nthe background. When it connects, the `delivery_state_changed`\nevent lands and the status flips to **Online** \u2014 the **New**\nand **Show My Address** buttons enable.\n\n![Network connects](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdeZRU9Z3w/1td1Su9AoIsAqIoIKIgi+CKGkUQ3IJrnJlEiVETl5hjZpJMnkk8muhMjkbRMdGYiUtw38BdjBpRaFZxRZAlInvbQK90d1X//qjf9MOD0DZrt3xfrz/mVN2+detzL55JvavurYp17949AqKovr6+tUcAANjjMlp7AAAAYO9JtPYAAADA7heLxfLz8/Py8qIoqq6urqysbGxsjAQAAADsk/Lz8/Pz85tuR1FUUVEROQUIAAD2Sen3/r96VwAAAMA+KCMjY5t3BQAAAAREAAAAQEAEAAAABMS3ALWOWCyWk5NTUFCQnZ2dSCQSicRWJ2ntBalUqqGhoaGhYfPmzRUVFbW1telvhtpd9vQ+7un5AQD2SQJgb8vIyCgpKSkpKUkmkzU1NVVVVQ0NDclkcu+/eI3FYvF4PJFIZGVl7b///vF4vLy8vLy8PJVK7eKW984+7rn5AQD2YbHu3bu39gwBKSgo6NSpU11d3caNGxsaGlp7nP9HIpEoKirKyspau3Zt+jtid05r7eOuz19fX7/bpwIAaC1dunTZasmqVasinwDsNbFYrEOHDkVFRWVlZXV1da09zjY0NDSUlZVlZWV16tQpOzu7rKxsR9+wb9193PX5AQBCEC8sLGztGfZ9sVisS5cuOTk5a9euTSaTrT1Oc5LJZHV1dXFxcV5eXmVlZcsf2Eb2cafnj6LIuUMAwL6koKBgqyXpV0e+BWhv6NChQ2Zm5vr1678R70mnUqm1a9dmZWV16NCh5Y9qO/u4c/MDAARCAOxxBQUFRUVFbeGV8Q5Zv359UVHRV8Nxm9rgPu7Q/AAA4RAAe1ZGRkanTp2+ieejp1KpsrKyTp06xWKx5tdsm/vY8vkBAIIiAPaskpKSurq6tnnV79eqq6urr69v375986u12X1s4fwAAEHZgQA48MAD77zzznnz5i1atOiFF14488wz08u7d+/++eefz5s3r+WbKiws/PGPf3z44Yfv2LDfNLFYrKSkZOPGja09yM7bsGFDSUlJM2+it/F9/Nr5AQBC09IAOPjgg6dMmXLWWWfl5uauX7/+8MMPnzRp0hVXXLFzz3rUUUddd911AwYM2Lm RvgcAAAAAAAAA8BiABAAAAAAAAIBRBBIAAAAAAAAARhFIAAAAAAAAABhFIAEAAAAAAABgFIEEAAAAAAAAgFEEEgAAAAAAAABGEUgAAAAAAAAAGEUgAQAAAAAAAGAU+X/9soRI4HYAQgAAAABJRU5ErkJggg==)\n\n**Show My Address** calls `get_address()` \u2014 this installation's\naddress, what a peer needs to open a conversation with you (your\nkey package was published to the registry during `init`, so the\naddress alone is enough). It is shown in a dialog, ready to share.\n\nCopied \u2014 you'd send this to whoever you want to chat with.", "execs": [{"kind": "ui_test", "cmd": "nix run 'github:logos-co/logos-chat-ui/ec54b37e9ef1a96b737afd8ec65c106c04e6449f'\n\n# test actions:\n- Window opens: wait for ['Chat']\n- Network connects: wait for ['Online']\n- Open your address: click 'Show My Address'\n- Address dialog shows: wait for ['My Address', 'Share this address with others to start a conversation:']\n- Copy to clipboard: call 'Copy address'.clicked()\n- Copied confirmation: wait for ['Copied to clipboard']", "status": "pass", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m Tutorial: The Logos Chat UI: Drive the app\n\n1 passed, 0 failed\n\n", "note": ""}]}]}, {"meta": {"name": "Tutorial: Run the automated message-exchange test", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"md": "# Tutorial: Run the automated message-exchange test\n\nA conversation takes two people: one shares their address, the other pastes\nit into **New**, sends a first message, and the reply flows back. That\nround-trip spans **two** app instances, so the single-window walkthrough in\n*The Logos Chat UI* tutorial can't express it \u2014 and neither can the doc-test\n`ui_test` driver on its own, which works against one instance and can only set\nliteral field values (it can't read one window's address out and paste it\ninto another).\n\n`logos-chat-ui` ships an automated test for exactly this. The `exchange` app\ndrives the real two-party round-trip over the live network between two headless\ninstances, then exposes the receiving window so the finished thread can be\ncaptured. This tutorial runs that test and shows its result; the full\nstep-by-step flow \u2014 address, first message, reply \u2014 with screenshots of **both**\nwindows is in\n[docs/two-instance-exchange.md](../docs/two-instance-exchange.md).\n\n**What you'll build:** A verified end-to-end message round-trip between two chat UI instances, captured from the receiving window.\n\n**What you'll learn:**\n\n- How the `exchange` app runs the full two-party round-trip headless over the live network\n- Why a two-window exchange needs a dedicated runner rather than the single-instance `ui_test` driver\n- Where the step-by-step, both-windows walkthrough and its regeneration script live\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, Rust) during the builds.\n- **Network access.** The two delivery nodes discover each other over the configured network preset; an isolated sandbox won't complete the exchange.", "execs": []}, {"md": "## Step 1: Run the automated exchange\n\nThe `exchange` app launches two instances offscreen and runs the real\nround-trip over the live network \u2014 Alice shares her address, Bob opens a\nconversation with it and, once she joins, sends the first message, Alice\nreplies \u2014 then opens the capture port onto the live receiving window so\nthe finished thread is on screen. The whole round-trip happens while the\nlaunch is still coming up, so the screenshot below captures the\nalready-completed conversation.", "execs": []}, {"md": "### 1.1 Run the round-trip and show the result\n\n```bash\nnix run 'github:logos-co/logos-chat-ui/ec54b37e9ef1a96b737afd8ec65c106c04e6449f#exchange'\n```\n\nThe receiving window after the round-trip: the peer's opening\nmessage and the reply, each end-to-end-encrypted and carried over\n`delivery_module`. The same exchange, step by step across both\nwindows, is in\n[docs/two-instance-exchange.md](../docs/two-instance-exchange.md).\n\n![Round-trip complete](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdd5xU5aH44XdmG7ssZQFpAkoRUbCLiA0hYgGvYpBYsJdYI7aIUWOMXVHRq8aYKLFGLASjaLCAwShGRBBRQEEBQUDaUpZld9ny+2OS/e1FwWUFFn2f5498Zt4558x7uO79nO/MOWcSrVq1CgAAQByStT0BAABg6xEAAAAQEQEAAAAREQAAABARAQAAABERAAAAEBEBAAAAEREAAAAQkfTankCkEolEnTp16tWrl5WVlZ6enp6enkxu7RgrLy8vLS0tLS0tLi5evXp1UVFRRUXFZtz+lt7HLT1/AICfpIRfAt7KkslkXl5eXl5eWVnZ2rVrS0pKSktLy8rKtv7BayKRSEtLS09Pz8zMzM7OTktLy8/Pz8/PLy8v/4Fb3jr7uOXmDwDwEyYAtqp69eo1bdq0pKRk5cqVpaWltT2d/yM9Pb1BgwaZmZmLFy9evXp1jbdTW/u4ueYPAPDTlla/fv3ankMUEolEkyZNGjduvGzZsoKCgm3wU+ry8vLUp/XbbbddWlra2rVrN3ULtbuPP3z+AAAxEABbQyKRaNGiRZ06dRYvXlxWVlbb09mYsrKywsLChg0b5uTkFBQUVH/FbWQfazx/AIBIuAvQ1tC4ceOMjIylS5f+KK5SLS8vX7x4cWZmZuPGjau/1razjzWbPwBAJATAFlevXr0GDRpsC0fGm2Tp0qUNGjSoV69edRbeBvdxk+YPABAPAbBlJZPJpk2bLlu2bNs5Mq6m8vLyZcuWNW3aNJFIbHzJbXMfqz9/AICoCIAtKy8vr6SkpKSkpLYnUhMlJSXr1q1r1KjRxhfbZvexmvMHAIjKJgRA27Zt77///smTJ8+cOfPVV1899thjU+OtWrWaN2/e5MmTq7+p+vXrX3755bvtttumTfbHJpFI5OXlrVy5srYnUnMrVqzIy8vbyIfo2/g+fu/8a2br/C20bNky9S5ffPHFmDFjTj311NT4gAED5s2b9/DDD9dg5hkZGWPHjp03b95FF11UOdijR4/nn39+xowZs2bNGjNmzKBBg9LT//MTgenp6YMHD544ceKsWbNefPHFffbZpzrvcuCBB86bN69r1641mCEAsKVVNwA6dOjw8ssv9+vXLzs7e+nSpbvtttsDDzxwwQUX1Oxd99lnn8suu6xLly41W/3Hok6dOmVlZZt0L/y0tLRzzz331VdfnTp16rvvvvvnP//5gAMO2HIz/F6lpaXl5eV16tTZ0AKbtI95eXmfffbZ8OHDK0d+//vfDx48eDNMdAO+d/41sHX+FurXrz9y5Mh+/frVrVt3yZIlHTt2vPXWW88555wfOPnLLrtsp512qjpy6KGHPvHEE926dfv8888//fTTDh06XHnllTfffHPq1dtuu+3iiy/OycmZPXv2Pvvs88wzz6y3+npycnL22WefG2644QfOEwDYcqobADfddFODBg3eeOONPfbYo3v37pdeemkI4YorrmjSpEkN3nWPPfaowVrbgsyW2W2G7rHLuz13ebdnm6F7ZLTY2JFlvXr1NvVu9EOGDBkwYMCdd955yCGH9O3b94UXXujfv/96y6SlpW3yvH+AtWvXbuRS2hrsY7t27Xr06PGD51VdG59/DWydv4UBAwa0bNlyypQp++yzz/77 zzRNp6amTpkyRSAQ6PX6n376iVvScdy4cRqN5pVXXuHO3bdvHze4JTc3V6VSORyO2tpablotTdObNm2aM2fOgw8+ePny5fz8fO6UvLw8rtWem5ubm5u7Zs0ap9OZlpZGCPEOZVm7dm1zc/Px48fDwsJWrFjhcrl27drFjZW/dOlSYWHhggULVCqVzWbrumJKL23fvn327NmvvvoqTdN1dXXFxcWEkJ5VoChKo9FIJBK5XK5SqQQCgUajEQqFfbpdPqvg83a53e5NmzZlZ2dzK5Nu3LiRYRh/2YaFhT322GMSicRsNh84cIBr1vtLnDNnjlQqtVgs3qVofF5LqVT6/BZ8ZuuTz2wJITt37pw3b95rr71mtVp37tzZ3t6uUql81uvWoryDje4QEyZMiI2N/fHHH7n7MnfuXIvF4p2EDgAAAAAAN+OOCwDkcvnMmTOFQiEXAHBTAnwO/QcAAAAAgL664wIAAAAAAADoP5j/CgAAAAAQRBAAAAAAAAAEEQQAAAAAAABBBAEAAAAAAEAQQQAAAAAAABBEEAAAAAAAAAQRBAAAAAAAAEHk/wGbhTE2mND4tQAAAABJRU5ErkJggg==)", "execs": [{"kind": "ui_test", "cmd": "nix run 'github:logos-co/logos-chat-ui/ec54b37e9ef1a96b737afd8ec65c106c04e6449f#exchange'\n\n# test actions:\n- Round-trip complete: wait for [\"Hi Alice, it's Bob \ud83d\udc4b\", 'Hi Bob, got it']", "status": "pass", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m Tutorial: Run the automated message-exchange test: Run the round-trip and show the result\n\n1 passed, 0 failed\n\n", "note": ""}]}]}, {"meta": {"name": "Tutorial: Run the automated group-chat test", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"md": "# Tutorial: Run the automated group-chat test\n\nA group conversation goes further than a 1:1 chat: one person creates it,\ninvites others by address, and every message fans out to the whole roster with\nthe sender attributed. That spans **three** app instances and grows by\nmembership commits over the live network \u2014 more than the single-window\nwalkthrough in *The Logos Chat UI* tutorial can express, and more than the\ndoc-test `ui_test` driver can orchestrate on its own (it works against one\ninstance and can't read one window's address out to invite it into another).\n\n`logos-chat-ui` ships an automated test for exactly this. The `group` app\ndrives the real three-party flow over the live network between three headless\ninstances \u2014 Alice creates the group, invites Bob and Carol, and once the roster\nconverges sends a message that reaches both \u2014 then exposes the newest member's\nwindow so the finished group can be captured.\n\n**What you'll build:** A verified three-member, end-to-end-encrypted group conversation across three chat UI instances, captured from a receiving member's window.\n\n**What you'll learn:**\n\n- How the `group` app forms a three-member group and fans a message out to it, headless over the live network\n- How the group UI adds a members pane and per-message sender attribution over a 1:1 chat\n- Why a multi-window group needs a dedicated runner rather than the single-instance `ui_test` driver\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, Rust) during the builds.\n- **Network access.** The three delivery nodes discover each other over the configured network preset; an isolated sandbox won't complete the flow. Expect membership changes to take minutes.", "execs": []}, {"md": "## Step 1: Run the automated group chat\n\nThe `group` app launches three instances offscreen and runs the real flow\nover the live network \u2014 Alice creates the group, invites Bob and Carol,\nand once all three are in she sends a message that fans out to both \u2014 then\nopens the capture port onto Carol's live window so her copy of the group is\non screen. The whole flow happens while the launch is still coming up, so\nthe screenshot below captures the already-formed group: the creator's\nmessage, received with its sender label, beside the three-member roster.", "execs": []}, {"md": "### 1.1 Run the group flow and show the result\n\n```bash\nnix run 'github:logos-co/logos-chat-ui/ec54b37e9ef1a96b737afd8ec65c106c04e6449f#group'\n```\n\nCarol's window after the group formed: Alice's message, received\nwith its sender label and end-to-end-encrypted over\n`delivery_module`, beside the members pane listing the\nthree-member roster.\n\n![Group message received](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdd3iV5cH48fskIYsZwMgSEBGtA0WQKrgFa12IinsgirTugdpai3Xgqqvu8aKiuBW14kRQWgEZIoosCchQkD0SEhIyfn+ct/nlBaUBEcT787l69TrnOc85536OIXm+zzqJZs2aBQAAIA4pW3sAAADAliMAAAAgIgIAAAAiIgAAACAiAgAAACIiAAAAICICAAAAIiIAAAAgImlbewCRSiQSmZmZtWvXzsjISEtLS0tLS0nZ0jFWXl5eWlpaWlpaXFycn5+/Zs2aioqKzfj6P/cy/tzjBwD4VUr4JuAtLCUlJScnJycnp6ysrKioqKSkpLS0tKysbMuvvCYSidTU1LS0tPT09KysrNTU1OXLly9fvry8vPwnvvKWWcafb/wAAL9iAmCLql27dm5ubklJycqVK0tLS7f2cP6PtLS0unXrpqenL1q0KD8/f5NfZ2st4+YaPwDAr1tqnTp1tvYYopBIJBo2bNigQYOlS5cWFBT8ArdSl5eXJ7fWb7fddqmpqUVFRRv7Clt3GX/6+AEAYiAAtoREItG4cePMzMxFixaVlZVt7eFsSFlZWWFhYb169bKzswsKCqr/xF/IMm7y+AEAIuEqQFtCgwYNatSosWTJkm3iLNXy8vJFixalp6c3aNCg+s/65Szjpo0fACASAuBnV7t27bp16/4S1ow3ypIlS+rWrVu7du3qzPwLXMaNGj8AQDwEwM8rJSUlNzd36dKlv5w142oqLy9funRpbm5uIpHY8Jy/zGWs/vgBAKIiAH5eOTk5JSUlJSUlW3sgm6KkpGTt2rX169ff8Gy/2GWs5vgBAKKyEQGw4447PvDAA59//vmMGTPeeeedbt26Jac3a9Zs3rx5n3/+efVfqk6dOldeeeWee+65cYPd1iQSiZycnJUrV27tgWy6FStW5OTkbGAj+i98Gf/r+DdNbm7ubbfdNm7cuFmzZn300UennHLKlt/P0KNHjw8++CAvL2/s2LHXX399ZmZm5UMdO3Z88cUXp06dOn369Ndee61Tp07J6cl/qus4/fTTQwj333//+g8l/1Hfc8898+bN69mz5/pjyMjI+NOf/jR69OhZs2Ylh5GdnV356EknnZQc4aeffnrNNddUHWFWVtbMmTMvvfTSn+ezAdgmffLJJ8lfv5W/t0MIZ5xxRnLioEGDfvpbjB49et68ebvssstPfym2adX9JuDWrVu/8cYbdevWXb169ZIlS/bcc88HH3ywSZMmjzzyyCa8a/v27a+44ooFCxZMmjRpE56+rcjMzCwrK9uoa+Gnpqb26tWre/fuO+yww6pVq6ZMmfLUU0+NGjXq5xvkhpWWlpaXl2dmZv7YVTU3ahlzcnI+/fTTzz///NRTT01OufHGGwsLC++4447NNuL/67+OfxM0atTozTffbNKkSWlpaX5+fuvWre+6664999zz+uuv31xv8V/16tXrxhtvLC8vHzVqVMuWLfv06bP77ruffvrpFRUV++yzz0svvZSWlrZs2bKKioqOHTs+99xz3bt3nzhxYk5OTghhyZIlixYtqnyp77//PoTw7bffTpkypXJirVq1mjdv/l+v5vToo4926dKltLR0wYIFjRs37tOnz4477njeeeeFEM4///wbbrihrKxs2rRpTZo0ueSSS3baaac+ffqkpaU1b9786quvTk9P/1k+GoBt3+GHH175p//www/fuoPhV6m6ewBuvvnmu <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function indexFromHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return 0;
    if (/^\d+$/.test(raw) && +raw < DATA.tutorials.length) return +raw;
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === raw || t.meta.name === raw
    );
    return i >= 0 ? i : 0;
  }
  function show(idx) { picker.value = idx; render(idx); }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    render(+picker.value);
  });
  window.addEventListener("hashchange", () => show(indexFromHash()));
  show(indexFromHash());
</script>
