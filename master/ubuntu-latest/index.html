<script id="report-data" type="application/json">{"generated_platform": "Linux", "summary": {"passed": 4, "failed": 0, "skipped": 0}, "tutorials": [{"meta": {"name": "Tutorial: The Logos Chat UI", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"md": "# Tutorial: The Logos Chat UI\n\n`chat_ui` is a Logos **UI module**: a QML view backed by a small C++ class\n(the *universal* typed-backend authoring model) that drives the Rust\n`chat_module` \u2014 end-to-end-encrypted conversations carried over\n`delivery_module`. You write a `.rep` view contract and a `*Backend` deriving\n`LogosUiPluginContext`; the plugin glue, the typed `modules().chat_module`\ncaller, and the QtRO wiring are generated.\n\nThis tour builds the app, watches it connect to the network, and shares your\naddress (what a peer needs to start a conversation with you).\n\n> **The two-party exchange has its own tutorial.** A message exchange is\n> inherently two-party, so it gets its own walkthrough \u2014 *Run the automated\n> message-exchange test* \u2014 which drives the real round-trip between two windows\n> and shows the result, with the step-by-step flow in\n> [docs/two-instance-exchange.md](../docs/two-instance-exchange.md). This\n> tutorial covers everything a single window shows: connecting, and sharing\n> your own address.\n\n**What you'll build:** A running Logos chat app, connected to the network and sharing your address from the GUI.\n\n**What you'll learn:**\n\n- How a `type: ui_qml`, `interface: universal` module is built and run\n- The connection lifecycle: init is non-blocking and the UI goes Online when delivery connects\n- Sharing your address \u2014 what a peer needs to open an encrypted conversation with you\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, Rust) during the builds.\n- **Network access.** The two delivery nodes discover each other over the configured network preset; an isolated sandbox won't complete the exchange.", "execs": []}, {"md": "## Step 1: Build the chat UI\n\nThe module builds with the standard `mkLogosQmlModule` flake output \u2014\n`chat_ui_plugin.so` (the C++ backend + generated glue) and\n`chat_ui_replica_factory.so` (the QtRO replica for the QML view).", "execs": []}, {"md": "### 1.1 Build the plugin\n\n```bash\nnix build 'github:logos-co/logos-chat-ui'\n```\n\nThe build runs the universal UI codegen (`logos-qt-generator --backend\nui`) over `src/ChatBackend.rep`, compiles `ChatBackend` (which derives\n`ChatBackendSimpleSource` + `LogosUiPluginContext`), and emits the\n`chat_ui_plugin` / replica-factory glue around it.", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-chat-ui/b4d2bb3366766ecce74f556264d0d0c5abb8b877' -o result", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "## What the chat UI does\n\nThe window is a two-pane messenger:\n\n- **Left:** your conversations, under a **New chat** button (start a\n  direct message from someone's address, or a group), with your own\n  account card at the foot: its short form, the delivery state\n  (`Stopped` \u2192 `Initialising...` \u2192 `Online`), and your address with a\n  copy button beside it.\n- **Right:** the message thread for the selected conversation, under a\n  header carrying its avatar, its description and who is in it, and a\n  composer with the send action at its end.\n\nUnder the hood the backend calls `modules().chat_module` \u2014 typed methods\n(`init`, `get_address`, `create_conversation`, `send_message`, \u2026)\nand string-keyed event subscriptions (`message_received`,\n`delivery_state_changed`, \u2026) that push updates into the view with no\npolling. `init` kicks off the delivery node asynchronously and returns\nimmediately; the UI flips to **Online** when the\n`delivery_state_changed` event reports the network is up.", "execs": []}, {"md": "## Step 2: Launch and connect, then share your address\n\nRun the app headless (offscreen Qt) and drive it: wait for the network to\ncome up, then copy your address \u2014 the everything-a-single-window-shows\nhalf of the tour.", "execs": []}, {"md": "### 2.1 Drive the app\n\n```bash\nnix run 'github:logos-co/logos-chat-ui/b4d2bb3366766ecce74f556264d0d0c5abb8b877'\n```\n\nThe chat window opens; the account card starts at **Stopped** while delivery boots.\n\n`init` returned right away and the delivery node bootstrapped in\nthe background. When it connects, the `delivery_state_changed`\nevent lands and the state flips to **Online** \u2014 **New chat**\nenables and the backend reads `get_address()` onto the account\ncard. That address is what a peer needs to open a conversation\nwith you; your key package was published to the registry during\n`init`, so the address alone is enough.\n\n![Network connects](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdeZRUdYLg+xsZmeTCkux7kuw7KoriLoKKgFq49imrlKpSqW6rrfG97p6eNzPn9Jkz033e9FR31avq0nYp7cayypZyRUTEElEpFZQtkZ1MtkS2TJaE3CPj/XFnYnIyE0wUQev3+fwFN27c+N0bERn3G/dGRKJnz54RAAAQhqxzPQAAAODsEQAAABAQAQAAAAERAAAAEBABAAAAAREAAAAQEAEAAAABEQAAABAQAQAAAAERAAAAEBABAAAAAck+I0vJy8srKCjIyclJJpPZ2dmJROKMLBZoLZ1ONzY2plKphoaG6urq2tras3CjnuMAcE58Fa/7iZ49e37hKyeTya5duxYUFKRSqdra2sbGxqamplQqlU6nv/zIgDYlEolkMpmVlZWdnZ2Xl5dMJqurq48cOZJKpc74bWWe442NjTU1NfX19U1NTY2NjZ7jAHB2JBKJ7OzsrKysDh065OfnZ2dnf/nX/S8YAIlEorCwsHPnzjU1NdXV1U1NTV94BMCXkZWVVVBQkJ+fX1VVdfTo0TO1a555jp84caKqqspzHAC+DrKysjp37tyxY8cv87r/RQIgmUz26tUrnU7bLYCvifjPQSKROHjw4Jc/FBA/x5uamr6iAwsAwJcRH6LPysr6Yq/7yYKCgtO6Qk5OTt++fevq6qqqqpwGAF8T6XS6rq4umUx269atpqbmy5R5/ByPDy96jgPA11A6na6pqUkmkz169PgCr/unFwDJZLJPnz4nTpyoqak5zXECX7mGhoampqbu3bufOHHii+27x8/xo0ePnjhx4owPDwA4g+rr61OpVM+ePU/3df80AiCRSPTu3bu+vt7eP3xtNTY2JhKJ+Nz9071u/Byvqamx9 teral field values (it can't read one window's address out and paste it\ninto another).\n\n`logos-chat-ui` ships an automated test for exactly this. The `exchange` app\ndrives the real two-party round-trip over the live network between two headless\ninstances, then exposes the receiving window so the finished thread can be\ncaptured. This tutorial runs that test and shows its result; the full\nstep-by-step flow \u2014 address, first message, reply \u2014 with screenshots of **both**\nwindows is in\n[docs/two-instance-exchange.md](../docs/two-instance-exchange.md).\n\n**What you'll build:** A verified end-to-end message round-trip between two chat UI instances, captured from the receiving window.\n\n**What you'll learn:**\n\n- How the `exchange` app runs the full two-party round-trip headless over the live network\n- Why a two-window exchange needs a dedicated runner rather than the single-instance `ui_test` driver\n- Where the step-by-step, both-windows walkthrough and its regeneration script live\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, Rust) during the builds.\n- **Network access.** The two delivery nodes discover each other over the configured network preset; an isolated sandbox won't complete the exchange.", "execs": []}, {"md": "## Step 1: Run the automated exchange\n\nThe `exchange` app launches two instances offscreen and runs the real\nround-trip over the live network \u2014 Alice shares her address, Bob opens a\nconversation with it and, once she joins, sends the first message, Alice\nreplies \u2014 then opens the capture port onto the live receiving window so\nthe finished thread is on screen. The whole round-trip happens while the\nlaunch is still coming up, so the screenshot below captures the\nalready-completed conversation.", "execs": []}, {"md": "### 1.1 Run the round-trip and show the result\n\n```bash\nnix run 'github:logos-co/logos-chat-ui/b4d2bb3366766ecce74f556264d0d0c5abb8b877#exchange'\n```\n\nThe receiving window after the round-trip: the peer's opening\nmessage and the reply, each end-to-end-encrypted and carried over\n`delivery_module`. The same exchange, step by step across both\nwindows, is in\n[docs/two-instance-exchange.md](../docs/two-instance-exchange.md).\n\n![Round-trip complete](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdeXxTVd7H8XOztE1KF9rSBYtlq6yiyCC4ALIooOyIggoiiPCMMsO4gSPC88yjDOCgIiOOyjPKuAyKLLIXEEFZZBFkKWsLBYotlNKWLmmb3HufPy5maiklbdO05Xzer758JTf3nvwSjTnf3HPOVSIiIgQAAAAAOZhqugAAAAAAvkMAAAAAACRCAAAAAAAkQgAAAAAAJEIAAAAAACRCAAAAAAAkQgAAAAAAJEIAAAAAACRCAAAAAAAkQgAAAAAAJEIAAAAAACRi8UorAQEBdrvdarWazWaLxaIoileaBXA1XdddLpeqqk6ns6CgoLCw0AdPymccAIAaUR3f+0pERESlDzabzaGhoXa7XVXVwsJCl8ulaZqqqrquV70yAGVSFMVsNptMJovFEhAQYDabCwoKsrOzVVX1+nO5P+Mul8vhcBQXF2ua5nK5+IwDAOAbiqJYLBaTyeTn52ez2SwWS9W/9ysZABRFCQkJCQoKcjgcBQUFmqZVugIAVWEymex2u81my83NzcnJ8VbX3P0Zz8/Pz83N5TMOAEBtYDKZgoKCAgMDq/K9X5kAYDabGzRooOs63QKgljD+d6AoSkZGRtVPBRifcU3TqunEAgAAqArjFL3JZKrc977ZbrdX6ACr1RodHV1UVJSbm8swAKCW0HW9qKjIbDbXr1/f4XBUJZkbn3Hj9CKfcQAAaiFd1x0Oh9lsDg8Pr8T3fsUCgNlsjoqKys/PdzgcFawTQLVzOp2apoWFheXn51eu7258xnNycvLz871eHgAA8KLi4mJVVSMiIir6vV+BAKAoSmRkZHFxMb1/oNZyuVyKohhj9yt6rPEZdzgc9P4BAKgTjO/9kJCQCn13V+A6ACEhIbqu0zMAajnjZ4CQkJCKHhgSEqJpWm5ubnVUBQAAqoMxKbdC3/ueBgCz2RwUFETPAKgTcnNzg4KCzGaz54cYn/Hs7OzqqwoAAFSH7OzsCn3vezoEKCwszOVyFRUVVaE2AD6i67rJZAoICPB8wF5YWBgD/AAAqIuM732bzebh97hHZwAURbHb7QUFBVWrDYDvFBQUVGiGj91u5xQfAAB1VG5uruff+x4FAH9/f1VVWfIfqEOMy3IHBAR4srO/v79xJe/qrgoAAFQHTdOcTqeH3/sWT3ay2+2FhYWeVxBfP3BIfNRdDUOjA/1tlgqMQgZQJodLTc8v2vFL9tIT509keToRv7Cw0MMPr91uZ/APAAB1muff+x4FAKvV6mHnwM+kvHRns2EtohVP9gbgGZvF3CTE3iTEPqJVw8XH0t/clVysXX+5X5fLZbPZPGnfarUy/gcAgDqtuLg4KCjIkz09CgBms9mTsQF+JmX+/W07Rld48UEAHlKEeKR  more than the single-window\nwalkthrough in *The Logos Chat UI* tutorial can express, and more than the\ndoc-test `ui_test` driver can orchestrate on its own (it works against one\ninstance and can't read one window's address out to invite it into another).\n\n`logos-chat-ui` ships an automated test for exactly this. The `group` app\ndrives the real three-party flow over the live network between three headless\ninstances \u2014 Alice creates the group, invites Bob and Carol, and once the roster\nconverges sends a message that reaches both \u2014 then exposes the newest member's\nwindow so the finished group can be captured.\n\n**What you'll build:** A verified three-member, end-to-end-encrypted group conversation across three chat UI instances, captured from a receiving member's window.\n\n**What you'll learn:**\n\n- How the `group` app forms a three-member group and fans a message out to it, headless over the live network\n- How the group UI adds a members pane and per-message sender attribution over a DM\n- Why a multi-window group needs a dedicated runner rather than the single-instance `ui_test` driver\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, Rust) during the builds.\n- **Network access.** The three delivery nodes discover each other over the configured network preset; an isolated sandbox won't complete the flow. Expect membership changes to take minutes.", "execs": []}, {"md": "## Step 1: Run the automated group chat\n\nThe `group` app launches three instances offscreen and runs the real flow\nover the live network \u2014 Alice creates the group, invites Bob and Carol,\nand once all three are in she sends a message that fans out to both \u2014 then\nopens the capture port onto Carol's live window so her copy of the group is\non screen. The whole flow happens while the launch is still coming up, so\nthe screenshot below captures the already-formed group: the creator's\nmessage, received with its sender label, beside the three-member roster.", "execs": []}, {"md": "### 1.1 Run the group flow and show the result\n\n```bash\nnix run 'github:logos-co/logos-chat-ui/b4d2bb3366766ecce74f556264d0d0c5abb8b877#group'\n```\n\nCarol's window after the group formed: Alice's message, received\nwith its sender label and end-to-end-encrypted over\n`delivery_module`, beside the members pane listing the\nthree-member roster.\n\n![Group message received](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdd1gU19oA8Hd3ti9t6SC9o4BiQbH3EqPGXqJibroakxjTk2tuoulfjInl2kti7L0gYkNRAStIlQ4CS6/L1pn5/hizl1CWBZYm7++Zx2d29sw7Z1Z255yZU1iWlpaAEEIIIYQQ6hnYnZ0BhBBCCCGEUMfBCgBCCCGEEEI9CFYAEEIIIYQQ6kGwAoAQQgghhFAPghUAhBBCCCGEehCsACCEEEIIIdSDYAUAIYQQQgihHgQrAAghhBBCCPUgWAFACCGEEEKoB8EKAEIIIYQQQj0IVgAQQgghhBDqQTgGiSIQCEQiEZfLJQiCw+GwWCyDhEUINUTTtEajIUlSrVbX1tYqFIoOOCh+xxFC9eBvEUIdoz2+ayxLS8tW70wQhJmZmUgkIklSoVBoNBqKokiSpGm67TlDCDWKxWIRBMFmszkcjkAgIAiitra2oqKCJEmDH0v7HddoNHK5XKVSURSl0WjwO44QYrFYHA6HzWbzeDyhUMjhcDrgtwjLG6gHao/rfisrACwWy9TU1NjYWC6X19bWUhTV6hwghNqCzWaLRCKhUFhdXV1ZWWmoy6H2Oy6Tyaqrq/E7jhDSjc1mGxsbi8XidvotwvIGQgyDXPdbUwEgCMLKyoqmaSwWINRFMJdeFotVXFzc9ttvzHecoqh2upmHEHpeMbfq2Wy2AX+LsLyBUENtvO4TIpGoRTtwuVxbW1ulUlldXY2P3hDqImiaViqVBEFIJBK5XN6WKyXzHWceL+J3HCHUIjRNy+VygiAsLCwM8luE5Q2EGtXG637LKgAEQdjY2MhkMrlc3sJ8IoTanVqtpijK3NxcJpO17nrJfMcrKytlMpnBs4cQ6iFUKhVJkpaWlm38LcLyBkK6tfq634IKAIvFsra2VqlU+G1EqMvSaDQsFotpu9/SfZnvuFwux9I/QqiNmN8iU1PTVv8WYXkDIX207rrfgnkATE1NaZrGkgFCXRxzG8DU1LSlO5qamlIUVV1d3R65Qgj1NEzD/db9FmF5AyH9teK6r28FgCAIY2NjLBkg1C1UV1cbGxsTBKH/Lsx3vKKiov1yhRDqaSoqKlr3W4TlDYRapKXXfX2bAJmbm2s0GqVS2Ya8IYQ6CE3TbDZbIBDo/wDd3NwcH7gjhAyL+S0SCoUt+i3C8gZCLdXS675eTwBYLJZIJKqtrW1b3hBCHae2trZFPXxEIhHeckMIGVx1dXVLf4uwvIFQK7Touq9XBYDP55MkiUPw <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function indexFromHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return 0;
    if (/^\d+$/.test(raw) && +raw < DATA.tutorials.length) return +raw;
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === raw || t.meta.name === raw
    );
    return i >= 0 ? i : 0;
  }
  function show(idx) { picker.value = idx; render(idx); }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    render(+picker.value);
  });
  window.addEventListener("hashchange", () => show(indexFromHash()));
  show(indexFromHash());
</script>
