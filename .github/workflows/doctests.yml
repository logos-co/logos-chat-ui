name: Doc-Tests

# Runs the executable doc-tests end-to-end via the shared doctest CLI, against
# the commit of logos-chat-ui under test. Each spec builds this UI module and
# drives it headless (offscreen Qt):
#   - chat-ui           build + connect + share-address GUI walkthrough (screenshots)
#   - chat-ui-exchange  runs the real two-party round-trip and captures the result
#   - chat-ui-group     forms a real three-party group and captures the result
#
# The dedicated two-instance-exchange.yml job stays the robust gate for the
# round-trip and regenerates docs/two-instance-exchange.md's screenshots.
#
# Each run publishes the two-column HTML report to:
#   https://<owner>.github.io/<repo>/pr-<N>/<os>/      (pull requests)
#   https://<owner>.github.io/<repo>/<branch>/<os>/    (pushes and manual runs)
# and (for PRs) posts/updates a comment with the links. The repo's GitHub Pages
# must be enabled once (deploy from the gh-pages branch); see the README.
#
# Note: pull requests opened from forks get a read-only GITHUB_TOKEN, so the
# Pages push and PR comment are skipped for them; the downloadable artifact is
# still produced. PRs from branches in this repo get the full clickable links.

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's runs share a group, so a push cancels the run it
# supersedes; every other run gets a group of its own and always finishes.
concurrency:
  group: doctests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  doctests:
    name: doc-tests (${{ matrix.os }})
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is off for now; see doctests-macos below.
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix and Logos cache
        if: matrix.os != 'macos-latest'
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      # macOS runs without the Logos cache: the delivery .lgx cached in Attic
      # lacks the libiconv its librln.dylib loads and crashes the doc-test when
      # substituted; building from source realises the dependency. Drop this
      # once the repinned delivery module bundles what its dylibs load.
      - name: Setup Nix (macOS, no Logos cache)
        if: matrix.os == 'macos-latest'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Resolve the commit under test. For pull requests this is the PR's head
      # commit (not the synthetic merge commit); for pushes it's the pushed
      # commit. Passed to --release-for below so the doc-test builds chat-ui
      # against THIS commit instead of the latest release. A fork PR's head
      # commit resolves as `github:logos-co/logos-chat-ui/<sha>` too.
      - name: Resolve commit under test
        id: commit
        shell: bash
        run: |
          echo "sha=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"

      # Pre-build the standalone app the doctest launches. The doctest warms it
      # too, but under a 30-minute build timeout the cache-less macOS build can
      # exceed, and it launches anyway when that build fails; here a broken build
      # fails the job before any spec runs. The spec drives it via
      # `nix run github:logos-co/logos-chat-ui/<sha>`. The app exposes no
      # buildable package attr, so recover the runner derivation from its
      # program string's context (a pinned github ref, so the lock matches the
      # spec's).
      - name: Pre-build the chat UI app
        shell: bash
        run: |
          ref="github:logos-co/logos-chat-ui/${{ steps.commit.outputs.sha }}"
          sys="$(nix eval --impure --raw --expr builtins.currentSystem)"
          drv="$(nix eval --impure --raw --expr \
            "builtins.head (builtins.attrNames (builtins.getContext (builtins.getFlake \"$ref\").apps.\"$sys\".default.program))")"
          nix build --no-link "$drv^*" -L

      # The runner is the shared `doctest` CLI, invoked directly via its flake
      # (github:logos-co/logos-doctest) at a pinned rev. --release-for pins the
      # {release} placeholder for logos-chat-ui to the commit under test, so every
      # `github:logos-co/logos-chat-ui{release}` URL in the spec becomes
      # `.../<sha>` and the module is built against this PR/push; it pins
      # logos-qt-mcp, which the specs drive the app with, to a fixed rev. Bump the
      # two harness revs on purpose, here and in the markdown step below.
      # The workspace tests-and-doctests pipeline parses this block to discover
      # the spec list, so keep every spec in the one array.
      - name: Run doc-tests
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          # The exchange and group specs mark their live sections `platform:
          # linux`, so the macOS leg skips them.
          specs=(
            doctests/chat-ui.test.yaml
            doctests/chat-ui-exchange.test.yaml
            doctests/chat-ui-group.test.yaml
          )
          # --continue-on-fail so the run walks every step and the published report
          # is complete. The job still fails (non-zero exit) if any step failed.
          nix run github:logos-co/logos-doctest/8a967779fb5e1953028aaac2de9316f6c676a630 -- run \
            "${specs[@]}" \
            --verbose \
            --continue-on-fail \
            --release-for logos-chat-ui=${{ steps.commit.outputs.sha }} \
            --release-for logos-qt-mcp=1fea509485a48ab185fafae8dc21bdbcc808a07e \
            --report "${{ runner.temp }}/chat-ui-doctest-report.html"

      - name: Stage report for upload
        if: always()
        shell: bash
        run: |
          # Name it index.html so the published directory URL renders directly,
          # under a directory named for the OS so the legs' reports merge into
          # one tree when publish-report downloads them.
          out="report-out/${{ matrix.os }}"
          mkdir -p "$out"
          if [ -f "${{ runner.temp }}/chat-ui-doctest-report.html" ]; then
            cp "${{ runner.temp }}/chat-ui-doctest-report.html" "$out/index.html"
          else
            echo "<h1>No report produced</h1>" > "$out/index.html"
          fi

      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chat-ui-doctest-report-${{ matrix.os }}
          path: report-out/
          if-no-files-found: warn

      - name: Verify markdown generation
        run: |
          for spec in doctests/chat-ui.test.yaml doctests/chat-ui-exchange.test.yaml doctests/chat-ui-group.test.yaml; do
            out="/tmp/$(basename "$spec" .test.yaml).md"
            nix run github:logos-co/logos-doctest/8a967779fb5e1953028aaac2de9316f6c676a630 -- generate \
              "$spec" \
              --release-for logos-chat-ui=${{ steps.commit.outputs.sha }} \
              --release-for logos-qt-mcp=1fea509485a48ab185fafae8dc21bdbcc808a07e \
              -o "$out"
            test -s "$out"
          done
          echo "Generated markdown successfully"

  # The macOS leg runs without the Logos cache (see its setup step above), so it
  # builds the whole chat stack from source: 30 to 50 minutes a run. Until the
  # delivery module bundles the libiconv its librln.dylib loads, this stands in
  # for it and fails at once; then put macos-latest back in the matrix and
  # delete this job.
  doctests-macos:
    name: doc-tests (macos-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Report the macOS leg as off
        run: |
          echo "::error title=macOS doc-tests are off::Without the Logos cache the macOS leg builds the whole chat stack from source, which takes 30 to 50 minutes. It comes back once the delivery module bundles the libiconv its librln.dylib loads."
          exit 1

  publish-report:
    name: Publish report to GitHub Pages
    needs: doctests
    # Run even when tests fail — a failing run is exactly when you want to open
    # the report. Skip on forks, where GITHUB_TOKEN can't push or comment.
    if: ${{ always() && github.event.pull_request.head.repo.fork != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write          # push to the gh-pages branch
      pull-requests: write      # post/update the PR comment

    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    # Serialize Pages pushes so two refs can't race on the gh-pages branch. The
    # queue keeps every waiting publish; a group otherwise holds only one.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: chat-ui-doctest-report-*
          # Merged, each report lands at artifacts/<os>/index.html however many
          # legs uploaded one; unmerged, a single artifact would be flattened.
          merge-multiple: true

      - name: Arrange site directory
        id: arrange
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="pr-${{ github.event.pull_request.number }}"
          else
            BASE="${{ github.ref_name }}"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

          mkdir -p "site/$BASE"
          found=""
          for os in ubuntu-latest macos-latest; do
            src="artifacts/$os/index.html"
            if [ -f "$src" ]; then
              mkdir -p "site/$BASE/$os"
              cp "$src" "site/$BASE/$os/index.html"
              found="$found $os"
            fi
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"

          # Landing page for this ref linking to each OS report.
          {
            echo "<!doctype html><meta charset=utf-8>"
            echo "<title>logos-chat-ui doc-test reports — $BASE</title>"
            echo "<style>body{font:16px system-ui;margin:40px;max-width:640px}a{color:#2563eb}</style>"
            echo "<h1>logos-chat-ui doc-test reports</h1>"
            echo "<p><strong>$BASE</strong> · commit <code>${TESTED_SHA::7}</code></p><ul>"
            for os in ubuntu-latest macos-latest; do
              if [ -d "site/$BASE/$os" ]; then
                echo "<li><a href=\"./$os/\">$os</a></li>"
              fi
            done
            echo "</ul>"
          } > "site/$BASE/index.html"

      - name: Deploy to gh-pages
        if: steps.arrange.outputs.found != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true          # don't wipe other PRs' directories
          commit_message: "Publish doc-test reports for ${{ steps.arrange.outputs.base }} (${{ env.TESTED_SHA }})"

      - name: Comment on PR with report links
        if: ${{ github.event_name == 'pull_request' && steps.arrange.outputs.found != '' }}
        uses: actions/github-script@v9
        with:
          script: |
            const base = "${{ steps.arrange.outputs.base }}";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const root = `https://${owner}.github.io/${repo}/${base}`;
            const oses = "${{ steps.arrange.outputs.found }}".trim().split(/\s+/).filter(Boolean);
            const sha = process.env.TESTED_SHA.slice(0, 7);

            const links = oses.map(os => `- [\`${os}\` report](${root}/${os}/)`).join("\n");
            const marker = "<!-- chat-ui-doctest-report-links -->";
            const body =
              `${marker}\n` +
              `### 📊 Doc-test report\n\n` +
              `The chat UI built against this commit and driven headless through ` +
              `the doc-test tutorials, rendered alongside the commands actually ` +
              `run and their output (updated each run, commit \`${sha}\`):\n\n` +
              `${links}\n\n` +
              `_Pages can take a minute to update after the run finishes._`;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });
            }
