name: QML Checks

# Static and unit checks for the plugin's QML, complementing the end-to-end
# doc-tests. Runs qmllint over the view and Qt Quick Test over the ChatUi
# components (headless, offscreen). Both need the Logos design system on the QML
# import path, which it takes from the design system's own source tree at the
# rev this flake resolves. The Qt Quick tooling itself comes from nixpkgs'
# qt6.qtdeclarative.
#
# A qmlformat --check gate is intentionally omitted: qmlformat's output varies
# between Qt versions, so a gate run against the CI's Qt would flag files a
# developer formatted with a different Qt. The tree is qmlformat-normalized (see
# the qmlformat baseline commit); enforce it in CI once the Qt version is pinned
# across environments.

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: qml-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qml-checks:
    name: qmllint + Qt Quick Test
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix and Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      # The design system ships Logos.Theme/.Icons/.Controls as static
      # qt_add_qml_module targets an app links, so no built artifact carries a
      # loose QML tree the tools could import. Take its source tree instead, at
      # the rev this flake resolves through chat_module's builder, which is the
      # one the app is built against.
      - name: Locate the Logos design system
        id: ds
        shell: bash
        run: |
          set -euo pipefail
          importpath="$(nix eval --impure --raw --expr \
            '(builtins.getFlake (toString ./.)).inputs.chat_module.inputs.logos-module-builder.inputs.logos-design-system.outPath')/src/qml"
          if [ ! -d "$importpath/Logos/Theme" ]; then
            echo "No Logos/Theme under $importpath" >&2
            exit 1
          fi
          echo "importpath=$importpath" >> "$GITHUB_OUTPUT"
          echo "Design system import path: $importpath"

      - name: qmllint
        shell: bash
        run: |
          set -euo pipefail
          nix shell nixpkgs#qt6.qtdeclarative --command bash -c '
            qmllint --version
            qmllint \
              -I src/qml \
              -I "${{ steps.ds.outputs.importpath }}" \
              $(find src/qml -name "*.qml" | sort)
          '

      - name: Qt Quick Test (offscreen)
        shell: bash
        run: |
          set -euo pipefail
          nix shell nixpkgs#qt6.qtdeclarative --command bash -c '
            set -euo pipefail
            # qmltestrunner here is unwrapped, so QtQuick.Controls and QtQuick.Layouts
            # are not on its default import path (qmllint resolves them itself;
            # qmltestrunner does not). Point it at the qtdeclarative QML module dir,
            # which sits next to the binary.
            qmlpath="$(dirname "$(dirname "$(readlink -f "$(command -v qmltestrunner)")")")/lib/qt-6/qml"
            [ -d "$qmlpath/QtQuick/Controls" ] || { echo "QtQuick.Controls not under $qmlpath" >&2; exit 1; }
            QT_QPA_PLATFORM=offscreen qmltestrunner \
              -input tests/qml \
              -import src/qml \
              -import "${{ steps.ds.outputs.importpath }}" \
              -import "$qmlpath"
          '
