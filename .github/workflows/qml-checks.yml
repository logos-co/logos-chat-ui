name: QML Checks

# Static and unit checks for the plugin, complementing the end-to-end doc-tests.
# Runs qmllint over the view, Qt Quick Test over the ChatUi components (headless,
# offscreen), and the backend unit tests. Every step runs in the flake's `tests`
# shell, on the Qt the module is built with. The QML steps need the Logos design
# system on the QML import path, which they take from the design system's own
# source tree at the rev this flake resolves.
#
# A qmlformat --check gate is intentionally omitted: qmlformat's output varies
# between Qt versions, so a gate run against the CI's Qt would flag files a
# developer formatted with a different Qt. The tree is qmlformat-normalized (see
# the qmlformat baseline commit); enforce it in CI once the Qt version is pinned
# across environments.

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's runs share a group, so a push cancels the run it
# supersedes; every other run gets a group of its own and always finishes.
concurrency:
  group: qml-checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend unit tests
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix and Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      # tests/cpp is a standalone CMake project over the backend, built against
      # doubles of the Logos SDK headers it includes, so it needs nothing but Qt
      # and builds without the SDK the plugin itself is compiled against.
      - name: ctest
        shell: bash
        run: |
          set -euo pipefail
          # The compiler comes from the shell's nixpkgs too: with the runner's
          # toolchain the binary keeps the system loader and libc while Qt brings
          # nixpkgs's, and the two disagree at load time (GLIBC_ABI_GNU2_TLS not
          # found).
          nix develop .#tests --command bash -c '
            set -euo pipefail
            cmake -S tests/cpp -B build/tests -GNinja
            cmake --build build/tests
            ctest --test-dir build/tests --output-on-failure
          '

  qml-checks:
    name: qmllint + Qt Quick Test
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix and Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      # The design system ships Logos.Theme/.Icons/.Controls as static
      # qt_add_qml_module targets an app links, so no built artifact carries a
      # loose QML tree the tools could import. The tests shell exports its source
      # tree instead, as LOGOS_DESIGN_SYSTEM_QML, at the rev this flake resolves
      # through chat_module's builder, which is the one the app is built against.
      - name: qmllint
        shell: bash
        run: |
          set -euo pipefail
          nix develop .#tests --command bash -c '
            set -euo pipefail
            if [ ! -d "$LOGOS_DESIGN_SYSTEM_QML/Logos/Theme" ]; then
              echo "No Logos/Theme under $LOGOS_DESIGN_SYSTEM_QML" >&2
              exit 1
            fi
            qmllint --version
            qmllint \
              -I src/qml \
              -I "$LOGOS_DESIGN_SYSTEM_QML" \
              $(find src/qml -name "*.qml" | sort)
          '

      - name: Qt Quick Test (offscreen)
        shell: bash
        run: |
          set -euo pipefail
          nix develop .#tests --command bash -c '
            set -euo pipefail
            # qmltestrunner here is unwrapped, so QtQuick.Controls and QtQuick.Layouts
            # are not on its default import path (qmllint resolves them itself;
            # qmltestrunner does not). Point it at the qtdeclarative QML module dir,
            # which the tests shell exports as QT_QML_DIR.
            [ -d "$QT_QML_DIR/QtQuick/Controls" ] || { echo "QtQuick.Controls not under $QT_QML_DIR" >&2; exit 1; }
            QT_QPA_PLATFORM=offscreen qmltestrunner \
              -input tests/qml \
              -import src/qml \
              -import "$LOGOS_DESIGN_SYSTEM_QML" \
              -import "$QT_QML_DIR"
          '
