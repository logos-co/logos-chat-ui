name: Two-instance exchange

# Drives a real bidirectional message exchange between two logos-chat-ui windows
# over logos-qt-mcp (doctests/exchange/run-exchange.sh) and regenerates the
# screenshots embedded in docs/two-instance-exchange.md. This doubles as an
# end-to-end GUI integration test: the job fails if the round-trip does not
# complete. The freshly captured screenshots are uploaded as an artifact so a
# reviewer can compare them against the committed copies and refresh them when
# the UI changes.
#
# This job is Linux only: it launches two standalone app instances on one host,
# which the script keeps apart via distinct data dirs and inspector ports. macOS
# still exercises the round-trip through the exchange spec
# in doctests.yml; this job is the dedicated, robust gate for it.

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: two-instance-exchange-${{ github.ref }}
  cancel-in-progress: true

env:
  ATTIC_CACHE: ${{ github.ref == 'refs/heads/master' && 'public' || 'ci' }}

jobs:
  exchange:
    name: two-instance exchange (ubuntu-latest)
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    env:
      ATTIC_CONFIGURED: ${{ secrets.ATTIC_ENDPOINT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://cache.nix.logos.co/public https://cache.nix.logos.co/ci
            extra-trusted-public-keys = public:l4HrXgL4nw246+LBh2SOJyhz64BoGegOYLheT/iIAPU= ci:aVJqjS4NWX5WfqHO0AEhIScjGu/JyK5FoydPrnEbMvc=
            fallback = true

      # Read-only, and the sole source for a large part of the Rust crate
      # closure. Drop it once a run shows Attic serving those paths.
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: logos-co
          skipPush: true

      # Publishing only; both caches are public to read, which the substituter
      # above already covers. ATTIC_TOKEN_PUBLIC lives in the public-cache
      # environment, so only the master jobs that opt into it reach the public
      # cache; every other ref pushes to ci with the repo-wide token. Skipped
      # until this repo is granted Attic credentials, and on fork PRs, which get
      # no secrets: an empty endpoint fails `attic use`.
      - name: Setup Attic cache
        if: env.ATTIC_CONFIGURED == 'true'
        uses: ryanccn/attic-action@v0.4.1
        with:
          endpoint: ${{ secrets.ATTIC_ENDPOINT }}
          cache: ${{ env.ATTIC_CACHE }}
          token: ${{ github.ref == 'refs/heads/master' && secrets.ATTIC_TOKEN_PUBLIC || secrets.ATTIC_TOKEN_CI }}

      # The exchange runs against the commit under test (FLAKE defaults to the
      # checked-out tree) and needs a real network: the two delivery nodes find
      # each other on the logos.test fleet, and init publishes each instance's
      # key package to the key-package registry.
      - name: Run the exchange and regenerate screenshots
        run: |
          nix shell nixpkgs#nodejs --command \
            bash doctests/exchange/run-exchange.sh "$PWD/docs/images/exchange"

      - name: Upload regenerated screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-instance-exchange-screenshots
          path: docs/images/exchange/*.png
          if-no-files-found: warn
