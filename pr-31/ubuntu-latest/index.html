<script id="report-data" type="application/json">{"generated_platform": "Linux", "summary": {"passed": 4, "failed": 0, "skipped": 0}, "tutorials": [{"meta": {"name": "Tutorial: The Logos Chat UI", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"md": "# Tutorial: The Logos Chat UI\n\n`chat_ui` is a Logos **UI module**: a QML view backed by a small C++ class\n(the *universal* typed-backend authoring model) that drives the Rust\n`chat_module` \u2014 end-to-end-encrypted conversations carried over\n`delivery_module`. You write a `.rep` view contract and a `*Backend` deriving\n`LogosUiPluginContext`; the plugin glue, the typed `modules().chat_module`\ncaller, and the QtRO wiring are generated.\n\nThis tour builds the app, watches it connect to the network, and shares your\naddress (what a peer needs to start a conversation with you).\n\n> **The two-party exchange has its own tutorial.** A message exchange is\n> inherently two-party, so it gets its own walkthrough \u2014 *Run the automated\n> message-exchange test* \u2014 which drives the real round-trip between two windows\n> and shows the result, with the step-by-step flow in\n> [docs/two-instance-exchange.md](../docs/two-instance-exchange.md). This\n> tutorial covers everything a single window shows: connecting, and sharing\n> your own address.\n\n**What you'll build:** A running Logos chat app, connected to the network and sharing your address from the GUI.\n\n**What you'll learn:**\n\n- How a `type: ui_qml`, `interface: universal` module is built and run\n- The connection lifecycle: init is non-blocking and the UI goes Online when delivery connects\n- Sharing your address \u2014 what a peer needs to open an encrypted conversation with you\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, Rust) during the builds.\n- **Network access.** The two delivery nodes discover each other over the configured network preset; an isolated sandbox won't complete the exchange.", "execs": []}, {"md": "## Step 1: Build the chat UI\n\nThe module builds with the standard `mkLogosQmlModule` flake output \u2014\n`chat_ui_plugin.so` (the C++ backend + generated glue) and\n`chat_ui_replica_factory.so` (the QtRO replica for the QML view).", "execs": []}, {"md": "### 1.1 Build the plugin\n\n```bash\nnix build 'github:logos-co/logos-chat-ui'\n```\n\nThe build runs the universal UI codegen (`logos-qt-generator --backend\nui`) over `src/ChatBackend.rep`, compiles `ChatBackend` (which derives\n`ChatBackendSimpleSource` + `LogosUiPluginContext`), and emits the\n`chat_ui_plugin` / replica-factory glue around it.", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-chat-ui/1216ce39e08f1291b5bda399f8cdebee0381e292' -o result", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "## What the chat UI does\n\nThe window is a two-pane messenger:\n\n- **Left:** your conversations, a `> \u03bb chat` header with a connection dot,\n  a **+ new** button (start a conversation from someone's address), and a\n  **Show My Address** button (share your own).\n- **Right:** the message thread for the selected conversation and a\n  composer (the **>>** send button).\n- **Status bar:** a human-readable status, the delivery state\n  (`Stopped` \u2192 `Initialising...` \u2192 `Online`), and your installation `ID`.\n\nUnder the hood the backend calls `modules().chat_module` \u2014 typed methods\n(`init`, `get_address`, `create_conversation`, `send_message`, \u2026)\nand string-keyed event subscriptions (`message_received`,\n`delivery_state_changed`, \u2026) that push updates into the view with no\npolling. `init` kicks off the delivery node asynchronously and returns\nimmediately; the UI flips to **Online** when the\n`delivery_state_changed` event reports the network is up.", "execs": []}, {"md": "## Step 2: Launch and connect, then share your address\n\nRun the app headless (offscreen Qt) and drive it: wait for the network to\ncome up, then open and copy your address \u2014 the everything-a-single-\nwindow-shows half of the tour.", "execs": []}, {"md": "### 2.1 Drive the app\n\n```bash\nnix run 'github:logos-co/logos-chat-ui/1216ce39e08f1291b5bda399f8cdebee0381e292'\n```\n\nThe chat window opens; the status bar starts at **Stopped** while delivery boots.\n\n`init` returned right away and the delivery node bootstrapped in\nthe background. When it connects, the `delivery_state_changed`\nevent lands and the status flips to **Online** \u2014 the **+ new**\nand **Show My Address** buttons enable.\n\n![Network connects](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdZ5gc933g+X91mO4JGGAQBpnIRCJAMJMiIYpUpCjLZ0sOsuy1Jfsen1c6+85rr8+7Dut9bveFz5Ktx0HWec9+HFa2nJOSRVEkxQwSIHLOOU+e6e7pqnvR4BAcDIZBJAfi//N5+GKmurr6VzUgUN/p6u6ks7MzACFMnz790KFDEz0FAMCbKzfRAwAAAG8dAQAAABERAAAAEBEBAAAAEREAAAAQEQEAAAAREQAAABARAQAAABERAAAAEBEBAAAAESlM9ACMLZvWln7s7vqKOWFyy0TPMpbugfyuE7kvPpFc6Lvyxmtl+HGHBACIU9LZ2TnRMzBaNrVt+L/+QO6rL+Qf3x26ByZ6nLFMbqnfszx9YF3h1/5m1Ol1NrWt9t9/KLSWJ2q00fqHiv/pS6+mAaZPn37o0KE3fyAAgImUb21tnegZGC39yfuSDfvzX94UKrWJnuUqKrXc3lMhSbJ3rsw9u//yW9KfvC9bdC1VZVMhmdo2asgxtbS0dHV1vQUTAQBMIK8BuBbVV8zJP757oqd4Zfkn9tSXzx61sL5izoQMM44rhwQAiJYAuCZNbrlGr/wZpas/TLniGaRr8EULVw4JABArAQAAABERAAAAEJE3621A659+f/32JaFnMP/w9vzfP/s6tpDevmT4f/9ACKH4f/5Zcq73jR4QAABi9GYFQLL7RK5UTG+8rv59tyXn+3KP7niTHmhM9U+8q37/6uTkxeJ//OJb+bgAAHCNe7WXAGVLZ4U5Ha9hu9/YWvjMv+a/tSOEUH9w3esZ7U2WTWurf/r91d/7RPX3PlH/9PuzqW0TPdGrUvvvPxxy38GFW/kJvuir93/7g5CmEzsDAEDMXu0zAOlNC+sfviV34Ezu27uSp/Yk/ZVXc6/ck3vq96/OZnekS2bm9p++6sbXzE8fvDldNCNpKoRzvbkvb8o/8tIzBtnMyfWfuj9dNis535v/4hO5Fw6HELJZU+qfeFc6a3LS3pxlITnVlf/Wjtw3toQQav/th7LrpocQstkd1T//VAih8EcP5x7befkjZlPbav/tpQ+rqt+xtH7DvFf5cVETbPaUkFz91iQZ/ugd2X2  is enough). It is shown in a dialog, ready to share.\n\nCopied \u2014 you'd send this to whoever you want to chat with.", "execs": [{"kind": "ui_test", "cmd": "nix run 'github:logos-co/logos-chat-ui/1216ce39e08f1291b5bda399f8cdebee0381e292'\n\n# test actions:\n- Window opens: wait for ['> \u03bb chat']\n- Network connects: wait for ['Online']\n- Open your address: click 'Show My Address'\n- Address dialog shows: wait for ['My Address', 'Share this address with others to start a conversation:']\n- Copy to clipboard: call 'Copy to Clipboard'.clicked()\n- Copied confirmation: wait for ['Copied to clipboard!']", "status": "pass", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m Tutorial: The Logos Chat UI: Drive the app\n\n1 passed, 0 failed\n\n", "note": ""}]}]}, {"meta": {"name": "Tutorial: Run the automated message-exchange test", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"md": "# Tutorial: Run the automated message-exchange test\n\nA conversation takes two people: one shares their address, the other pastes\nit into **+ new**, sends a first message, and the reply flows back. That\nround-trip spans **two** app instances, so the single-window walkthrough in\n*The Logos Chat UI* tutorial can't express it \u2014 and neither can the doc-test\n`ui_test` driver on its own, which works against one instance and can only set\nliteral field values (it can't read one window's address out and paste it\ninto another).\n\n`logos-chat-ui` ships an automated test for exactly this. The `exchange` app\ndrives the real two-party round-trip over the live network between two headless\ninstances, then exposes the receiving window so the finished thread can be\ncaptured. This tutorial runs that test and shows its result; the full\nstep-by-step flow \u2014 address, first message, reply \u2014 with screenshots of **both**\nwindows is in\n[docs/two-instance-exchange.md](../docs/two-instance-exchange.md).\n\n**What you'll build:** A verified end-to-end message round-trip between two chat UI instances, captured from the receiving window.\n\n**What you'll learn:**\n\n- How the `exchange` app runs the full two-party round-trip headless over the live network\n- Why a two-window exchange needs a dedicated runner rather than the single-instance `ui_test` driver\n- Where the step-by-step, both-windows walkthrough and its regeneration script live\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, Rust) during the builds.\n- **Network access.** The two delivery nodes discover each other over the configured network preset; an isolated sandbox won't complete the exchange.", "execs": []}, {"md": "## Step 1: Run the automated exchange\n\nThe `exchange` app launches two instances offscreen and runs the real\nround-trip over the live network \u2014 Alice shares her address, Bob opens a\nconversation with it and, once she joins, sends the first message, Alice\nreplies \u2014 then opens the capture port onto the live receiving window so\nthe finished thread is on screen. The whole round-trip happens while the\nlaunch is still coming up, so the screenshot below captures the\nalready-completed conversation.", "execs": []}, {"md": "### 1.1 Run the round-trip and show the result\n\n```bash\nnix run 'github:logos-co/logos-chat-ui/1216ce39e08f1291b5bda399f8cdebee0381e292#exchange'\n```\n\nThe receiving window after the round-trip: the peer's opening\nmessage and the reply, each end-to-end-encrypted and carried over\n`delivery_module`. The same exchange, step by step across both\nwindows, is in\n[docs/two-instance-exchange.md](../docs/two-instance-exchange.md).\n\n![Round-trip complete](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAEl doc-test `ui_test` driver can orchestrate on its own (it works against one\ninstance and can't read one window's address out to invite it into another).\n\n`logos-chat-ui` ships an automated test for exactly this. The `group` app\ndrives the real three-party flow over the live network between three headless\ninstances \u2014 Alice creates the group, invites Bob and Carol, and once the roster\nconverges sends a message that reaches both \u2014 then exposes the newest member's\nwindow so the finished group can be captured.\n\n**What you'll build:** A verified three-member, end-to-end-encrypted group conversation across three chat UI instances, captured from a receiving member's window.\n\n**What you'll learn:**\n\n- How the `group` app forms a three-member group and fans a message out to it, headless over the live network\n- How the group UI adds a members pane and per-message sender attribution over a 1:1 chat\n- Why a multi-window group needs a dedicated runner rather than the single-instance `ui_test` driver\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, Rust) during the builds.\n- **Network access.** The three delivery nodes discover each other over the configured network preset; an isolated sandbox won't complete the flow. Expect membership changes to take minutes.", "execs": []}, {"md": "## Step 1: Run the automated group chat\n\nThe `group` app launches three instances offscreen and runs the real flow\nover the live network \u2014 Alice creates the group, invites Bob and Carol,\nand once all three are in she sends a message that fans out to both \u2014 then\nopens the capture port onto Carol's live window so her copy of the group is\non screen. The whole flow happens while the launch is still coming up, so\nthe screenshot below captures the already-formed group: the creator's\nmessage, received with its sender label, beside the three-member roster.", "execs": []}, {"md": "### 1.1 Run the group flow and show the result\n\n```bash\nnix run 'github:logos-co/logos-chat-ui/1216ce39e08f1291b5bda399f8cdebee0381e292#group'\n```\n\nCarol's window after the group formed: Alice's message, received\nwith its sender label and end-to-end-encrypted over\n`delivery_module`, beside the members pane listing the\nthree-member roster.\n\n![Group message received](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdeWAMZx8H8N/M7mY3m/vOJhKRIASJCBFnibpvVVcppdqi3raqrx7qavHSKlrVklJ1Hy1133EEccslCCKH3Hc22SO7O/P+MemKuOKIRPf7+WvmmWeeeWYcO795LsbZ2ZkAgMjR0TE3N7emawEAAP8q+HGBWoit6QoAAAAAAMDLgwAAAAAAAMCEIAAAAAAAADAhCAAAAAAAAEwIAgAAAAAAABOCAAAAAAAAwIQgAAAAAAAAMCEIAAAAAAAATAgCAAAAAAAAE4IAAAAAAADAhIhrugLwcLyDJTe8naGRG9nIa7ouD1OkEl1PZzeeZvJLHjxYWyr/2EoCAAAA1DiWZS0tLcViMcs++3d5juP0en1JSQnHcVXJzzg7Oz/zxaCa8PaW+jlvsvujRKduUJGqpqvzMDZyQ3tfrmdz8YxtlV6veXtL3byhZCGrqapVVqqRfLmlKjGAo6Njbm7uS6gRAACYDvy4wGOwLGtra6tWq7VabRXf3R9VjlQqNTc3LywsrEo5IgsLi2e+GFQTblxn5sJt0d4rpNXVdF0eQatjb2YSw/AdG7Pnb1c8wo3rzNerTVGlmZixt6xUyYeSy+UqVa0MtwAA4JWFHxd4DCsrK61Wq1areZ5/nnJ4ntfr9URkbm6u1WqfmB9jAGojQyM30akbNV2LJxOdTjD4KiolGhq51UhlHuPBSgIAAADUOLFYXJX39SrSarVicZW69yMAqJVs5LW0508lhaVk+0ALUi0ctPBgJQEAAABqGsuyz9PzpxKO46o4kAABAAAAAACACUEAAAAAAABgQqorADB82L1s7cSyZe8YBgU/WwlcsE/Zukll6ybxjlYvtm4ApsDGxubu3bsKRS0d/+Ds7Hz37l17e/uarggAgOlxsxNescjesqarAjWjugIA5kY6G51C1uaGga241/yq6SqPYninU9m6SbqFI17ydcE0BQQErFq1Kjo6+s6dO5GRkcuXL2/RosVLu3rdunX//PPPmJiY27dvnzhx4p133qnKWSEhITt27Lh9+3ZcXNwPP/zwbJcOCAjYu3dvYmJiZGTkkCFDjOlBQUHbt2+/ceNGTEzM8uXLHR0dn618AAAAkyUSiSz+wTDMiy28qgEAX9+V3OyeotzDseJFe0TH4onI0Lv5s1StmvEOloYPu5cte6ds2TuGD7vzr0gQrJs3jJ5jnQgS1XCnL+UHy+nFDXapDUJDQ3fs2JGWljZkyJCmTZsOGjTo5MmTI0eOfDCnRCKpjgoUFxd/9913Xbt2DQoKmj59+meffda1a9fHn9KyZct169bt27evQ4cO3bp127lz5zNc18bGZt26dSdOnAgICJg5 <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function indexFromHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return 0;
    if (/^\d+$/.test(raw) && +raw < DATA.tutorials.length) return +raw;
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === raw || t.meta.name === raw
    );
    return i >= 0 ? i : 0;
  }
  function show(idx) { picker.value = idx; render(idx); }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    render(+picker.value);
  });
  window.addEventListener("hashchange", () => show(indexFromHash()));
  show(indexFromHash());
</script>
</body>
</html>
