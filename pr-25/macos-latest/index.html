<script id="report-data" type="application/json">{"generated_platform": "Darwin", "summary": {"passed": 3, "failed": 0, "skipped": 0}, "tutorials": [{"meta": {"name": "Tutorial: The Logos Chat UI", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"md": "# Tutorial: The Logos Chat UI\n\n`chat_ui` is a Logos **UI module**: a QML view backed by a small C++ class\n(the *universal* typed-backend authoring model) that drives the Rust\n`chat_module` \u2014 end-to-end-encrypted conversations carried over\n`delivery_module`. You write a `.rep` view contract and a `*Backend` deriving\n`LogosUiPluginContext`; the plugin glue, the typed `modules().chat_module`\ncaller, and the QtRO wiring are generated.\n\nThis tour builds the app, watches it connect to the network, and shares an\nintro bundle (the handshake that lets someone start a conversation with you).\n\n> **Where the two-party exchange lives.** A message exchange is inherently\n> two-party, and the doc-test `ui_test` driver works against a single app\n> instance and can only *set literal values* on fields \u2014 it can't read a\n> freshly-generated peer bundle out of one window and paste it into another.\n> So the full round-trip between two chat UIs is covered separately, in\n> [docs/two-instance-exchange.md](../docs/two-instance-exchange.md): a script\n> drives two instances through [logos-qt-mcp](https://github.com/logos-co/logos-qt-mcp)\n> and embeds the resulting screenshots. This GUI section covers everything a\n> single window shows: connecting, and sharing your own bundle.\n\n**What you'll build:** A running Logos chat app, connected to the network and sharing an intro bundle from the GUI.\n\n**What you'll learn:**\n\n- How a `type: ui_qml`, `interface: universal` module is built and run\n- The connection lifecycle: init is non-blocking and the UI goes Online when delivery connects\n- Sharing an intro bundle \u2014 the X3DH handshake that bootstraps a conversation\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, Rust) during the builds.\n- **Network access.** The two delivery nodes discover each other over the configured network preset; an isolated sandbox won't complete the exchange.", "execs": []}, {"md": "## Step 1: Build the chat UI\n\nThe module builds with the standard `mkLogosQmlModule` flake output \u2014\n`chat_ui_plugin.so` (the C++ backend + generated glue) and\n`chat_ui_replica_factory.so` (the QtRO replica for the QML view).", "execs": []}, {"md": "### 1.1 Build the plugin\n\n```bash\nnix build 'github:logos-co/logos-chat-ui'\n```\n\nThe build runs the universal UI codegen (`logos-qt-generator --backend\nui`) over `src/ChatBackend.rep`, compiles `ChatBackend` (which derives\n`ChatBackendSimpleSource` + `LogosUiPluginContext`), and emits the\n`chat_ui_plugin` / replica-factory glue around it.", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-chat-ui/00779492b5e7613715a16cd2cb082acac4dab575' -o result", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "## What the chat UI does\n\nThe window is a two-pane messenger:\n\n- **Left:** your conversations, a `> \u03bb chat` header with a connection dot,\n  a **+ new** button (start a conversation from someone's bundle), and a\n  **Get Intro Bundle** button (share your own).\n- **Right:** the message thread for the selected conversation and a\n  composer (the **>>** send button).\n- **Status bar:** a human-readable status, the delivery state\n  (`Stopped` \u2192 `Initialising...` \u2192 `Online`), and your installation `ID`.\n\nUnder the hood the backend calls `modules().chat_module` \u2014 typed methods\n(`init`, `create_intro_bundle`, `create_conversation`, `send_message`, \u2026)\nand string-keyed event subscriptions (`message_received`,\n`delivery_state_changed`, \u2026) that push updates into the view with no\npolling. `init` kicks off the delivery node asynchronously and returns\nimmediately; the UI flips to **Online** when the\n`delivery_state_changed` event reports the network is up.", "execs": []}, {"md": "## Step 2: Launch and connect, then share your bundle\n\nRun the app headless (offscreen Qt) and drive it: wait for the network to\ncome up, then open and copy your intro bundle \u2014 the everything-a-single-\nwindow-shows half of the tour.", "execs": []}, {"md": "### 2.1 Drive the app\n\n```bash\nnix run 'github:logos-co/logos-chat-ui/00779492b5e7613715a16cd2cb082acac4dab575'\n```\n\nThe chat window opens; the status bar starts at **Stopped** while delivery boots.\n\n`init` returned right away and the delivery node bootstrapped in\nthe background. When it connects, the `delivery_state_changed`\nevent lands and the status flips to **Online** \u2014 the **+ new**\nand **Get Intro Bundle** buttons enable.\n\n![Network connects](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdeZSdZ33g+ee9S+27SiVVaa/SvlmWF3nBLDYY0tA9WQgOTMicdDInhyScyZlOJ5yeTDKQSU/SczLp9JKT9NCEnEk4LIH0gZAODVkasAHbWLa8SLa20mJtJZVqX+72zh/XFOVSVUm2ZZWt5/P56+re9z7v7y0KeL9133tv0tXVFYAQOjs7+/v7l3oKAIDXV2apBwAAAG4cAQAAABERAAAAEBEBAAAAEREAAAAQEQEAAAAREQAAABARAQAAABERAAAAEBEBAAAAEckt9QDchNJlTZUP3lve2hNaG5ZyjuGJ7KEzmc88nAyOLeUYAABvJNnGxsalnoGbStrRVPzXD6UbukJdfolHqcunqzsqb92aeeRwMlm46uYNDQ1DQ0M3YC4AgCXkEiCus8qH7g2NdUs9xSyNdZUP3bvUQwAAvFEIAK6z8taepR5hrvKW7qUeAQDgjUIAcL0t7XX/82pznRsAwEsEAAAAREQAAABARAQAAABE5Hp+D0C6rrNy/84wMJL9xtNhqvjKnpwk5YfuDknIfOWJZGzqOk4FAADMuK4B0NNRvn9HCCHdvjr3b778yp6cJOX33hpCyPz9s+GaAyDd0lPZuCLz4uXkyf75N5j5RqoQfCcUAABcz0uAkseO5n/lz5ITFyu71qS7117HlRdS2bOu/FP3lO/ZNO+jaUdT8XceKu/bGFobQmtDed/G4r9+KO1ougGDsZDK4Gg6/QpfHQIA4Pq5tm8Crq8p/s5DoaEmGRxPJqYX2iqppMlkISmnlb0bQl1N5ruH590sXdtZ/vB9pZ++r/xP9qRbepLDZ5PJQkiS8o/dEULIHLtQ/vn7Sx+8J9 \n  \u001b[32m\u2713\u001b[0m Tutorial: The Logos Chat UI: Drive the app\n\n1 passed, 0 failed\n\n", "note": ""}]}, {"md": "## Step 3: Exchange messages between two windows\n\nA conversation takes two people. A peer pastes your bundle into their\n**+ new** dialog and sends the first message; you reply, and it flows back.\nThat round-trip spans two app instances, so it can't be expressed in the\nsingle-instance `ui_test` above (the driver can't read your live bundle out\nof one window and into another). Instead, the `chat-ui-exchange` app runs\nthe real two-party round-trip over the live network, then reopens the\nreceiving window so we can show the result here.\n\nThe full five-step flow \u2014 sharing the bundle, the first message, the reply \u2014\nwith screenshots of **both** windows is in\n[docs/two-instance-exchange.md](../docs/two-instance-exchange.md), driven by\n[`doctests/exchange/run-exchange.sh`](../doctests/exchange/run-exchange.sh)\nover [logos-qt-mcp](https://github.com/logos-co/logos-qt-mcp).", "execs": []}, {"md": "### 3.1 Run the round-trip and show the result\n\n```bash\nnix run 'github:logos-co/logos-chat-ui/00779492b5e7613715a16cd2cb082acac4dab575#exchange'\n```\n\nThe receiving window after the round-trip: the peer's opening\nmessage and the reply, each end-to-end-encrypted and carried over\n`delivery_module`. This is the same exchange that\n[docs/two-instance-exchange.md](../docs/two-instance-exchange.md)\nwalks through step by step, across both windows.\n\n![Round-trip complete](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdd5xdZYH44ffcMn2SzCQz6aSQEBIIHQtSVgKGYhcF2yqrYFnZ366KuriKLIh9RSyIHRVU7KCg9CAIAiEgLaGmh5kkkzKZesv5/TExhmQSJpAwCe/z/HXn3Pec+95L+Zzvvackzc3NAQhhxIgRq1atGuxZAADsWpnBngAAAPDCEQAAABARAQAAABERAAAAEBEBAAAAEREAAAAQEQEAAAAREQAAABARAQAAABERAAAAEJHcYE+AF6GKyurxe8+oHzo8X1E5iNMo9Pa0r1u95ImHenu6B3EaAAC7FQHATlZRWbXfoUfn8hWDPZGQr6hsbBozZNiIh+bO0QAAAH0cAsRONn7v/XaHvf9NcvmK8XvvN9i <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function indexFromHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return 0;
    if (/^\d+$/.test(raw) && +raw < DATA.tutorials.length) return +raw;
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === raw || t.meta.name === raw
    );
    return i >= 0 ? i : 0;
  }
  function show(idx) { picker.value = idx; render(idx); }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    render(+picker.value);
  });
  window.addEventListener("hashchange", () => show(indexFromHash()));
  show(indexFromHash());
</script>
