mYze5MxmNElFeVMi+XWFwwdL1r6yPj547nsiUXogIAAAC4Nwn/9Af92UfVQ88REcuq/L8c4Y5dvM1zcv9xwvjLR9R3/ooRkabzvz/K5kouLXpT6lu6axvaGcfJ2czsxeGlaISI7A5Xa8/2UnMAEosLLrfUu2MPES2nEnMz40QUmR5r7R54YHCvksumk4uGrhHR+gxZtDk6+gc5jieiXDa9FJ0rPLOWV9cnwOsDSCViwdrGrq2P6FpeVWXBZieiNUlpmR+fhUKhcn9UAAAAAACwgjFGjJmGwfNCz8BjU2M/WK3897hynwAAAAAAAEAh0ebo6H+IiDiej83N/Cyyf8ITAAAAAACAilLWJGAAAAAAALg/oAAAAAAAAKggKAAAAAAAACoICgAAAAAAgAqCAgAAAAAAoIKgAAAAAAAAqCAoAAAAAAAAKsj/A4ICAr0TvlgWAAAAAElFTkSuQmCC)\n\n**Get Intro Bundle** calls `create_intro_bundle()` \u2014 the X3DH\nprekey bundle a peer needs to start a conversation with you. It\nis shown in a dialog, ready to share.\n\nCopied \u2014 you'd send this to whoever you want to chat with.", "execs": [{"kind": "ui_test", "cmd": "nix run 'github:logos-co/logos-chat-ui/2baf6fab5660d4410e7c548259f607097f83c133'\n\n# test actions:\n- Window opens: wait for ['> \u03bb chat']\n- Network connects: wait for ['Online']\n- Open the intro bundle: click 'Get Intro Bundle'\n- Bundle dialog shows: wait for ['My Bundle', 'Share this bundle with others to start a conversation:']\n- Copy to clipboard: call 'Copy to Clipboard'.clicked()\n- Copied confirmation: wait for ['Copied to clipboard!']", "status": "pass", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m Tutorial: The Logos Chat UI: Drive the app\n\n1 passed, 0 failed\n\n", "note": ""}]}]}, {"meta": {"name": "Tutorial: Run the automated message-exchange test", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"md": "# Tutorial: Run the automated message-exchange test\n\nA conversation takes two people: one shares an intro bundle, the other pastes\nit into **+ new** with a first message, and the reply flows back. That\nround-trip spans **two** app instances, so the single-window walkthrough in\n*The Logos Chat UI* tutorial can't express it \u2014 and neither can the doc-test\n`ui_test` driver on its own, which works against one instance and can only set\nliteral field values (it can't read a freshly generated bundle out of one\nwindow and paste it into another).\n\n`logos-chat-ui` ships an automated test for exactly this. The `exchange` app\ndrives the real two-party round-trip over the live network between two headless\ninstances, then reopens the receiving window so the finished thread can be\ncaptured. This tutorial runs that test and shows its result; the full\nstep-by-step flow \u2014 bundle, first message, reply \u2014 with screenshots of **both**\nwindows is in\n[docs/two-instance-exchange.md](../docs/two-instance-exchange.md).\n\n**What you'll build:** A verified end-to-end message round-trip between two chat UI instances, captured from the receiving window.\n\n**What you'll learn:**\n\n- How the `exchange` app runs the full two-party round-trip headless over the live network\n- Why a two-window exchange needs a dedicated runner rather than the single-instance `ui_test` driver\n- Where the step-by-step, both-windows walkthrough and its regeneration script live\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, Rust) during the builds.\n- **Network access.** The two delivery nodes discover each other over the configured network preset; an isolated sandbox won't complete the exchange.", "execs": []}, {"md": "## Step 1: Run the automated exchange\n\nThe `exchange` app launches two instances offscreen and runs the real\nround-trip over the live network \u2014 Alice shares her bundle, Bob opens a\nconversation and sends the first message, Alice replies \u2014 then reopens the\nreceiving window from its saved history so the finished thread is on screen.\nThe whole round-trip happens while the launch is still coming up, so the\nscreenshot below captures the already-completed conversation.", "execs": []}, {"md": "### 1.1 Run the round-trip and show the result\n\n```bash\nnix run 'github:logos-co/logos-chat-ui/2baf6fab5660d4410e7c548259f607097f83c133#exchange'\n```\n\nThe receiving window after the round-trip: the peer's opening\nmessage and the reply, each end-to-end-encrypted and carried over\n`delivery_module`. The same exchange, step by step across both\nwindows, is in\n[docs/two-instance-exchange.md](../docs/two-instance-exchange.md).\n\n![Round-trip complete](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdeZzVdb348c/3nNk3GPYBEQVJESUVV6w0zFzTrJvrbbVb3tvivWV2b4t6s1VvWVb3l2mWpVaG1z0X1ERzRRQXwAUUQWUflhlmO8v398fghAg4KHDAz/P56I8z3/P9fs97DvXovM58l2TQoEEBCGHAgAFLly4t9RQAAFtWptQDAAAAW48AAACAiAgAAACIiAAAAICICAAAAIiIAAAAgIgIAAAAiIgAAACAiAgAAACIiAAAAICIlJV6AN6BKiqrh4/avb5P//KKyhKOkevqbFm5bP6cGV2dHSUcAwBgmyIA2MwqKqvGjn9fWXlFqQcJ5RWV/QYObeg7YMa0KRoAAKCbQ4DYzIaPGrstfPrvUVZeMXzU2FJPAQCwrRAAbGb1ffqXeoR11ffpV+oRAAC2FQKAzay0x/2vV3lFValHAADYVggAAACIiAAAAICIbKmrABW+eERh/1FhVXv27hnZ/3vkLeyhuP+o/JeODCGU/8fvk6Utm3tAAACI0ZYKgOTZVzOV5cV371g4Yb9kWWtmyswt9ELrVfj0oYWJY5MFy8vPvnprvi4AAGzjehsA6S5DkrbO8OryXq6fmfxUZvJT3R/EC8fstZUDoDd6blYVQnC7qK1m2OAhryxaFEJa6kEAACLV2wAo7r1T4bjxmRcWZ+57JnnwuWR1Z2+2yjzwXGHi2LSpsThqcGbOog3ufM/hxWP2Ke48MKkoC0tbMrc8nr3nH8GQDu5T+OzE4ughybKW7NX3Z6a/FEJIh/QtfPrQ4pA+SUN1moZk4Yrs32ZmJj8ZQsh976R0xwEhhLSpsesPXwghlF16d+beWWu/4jo3q3K7qK2mrLwsSdJ0A5//62vrqqurisViRUV5kiTLmpd3dHaGELKZbL/GvlVVlWkxXdXauqqlJYSww9Chi5cu7erqqqupGdC//6sLF3blcvV1tdVV1YuXLt2avxQAwHaktycBZ+9/NjP5qXRAff6T78v/8jP5M48q7rNzKMtufKt0xIDuB8WDd93QOsUDR+fPPq44dodQlg0LVqQN1WGXIWuvkD/zqOIug0N5Nm1qzH/hg2ltZQgh9KkujhyULGlJpr+Umb8sHd4//4n3Fg4ZE0JI5i9LVrWHEEKukJmzKDNn0Zof1/LGm1W5XdQ2orqqumX16lcXLlq+YmX/xsYQQgjJoIH9C4XCy68uWLhkSX1dXXV1dQiho6OjqrIyhFBVVZnP5ysrK0MIlRWV3c0AAMB69focgFeXl/3+3nDl34t77FA8aHRx/MjiviOTlo7kweey1z+atKz7CbtbYeKaj9TpgaPD1feHfGE965wyIYSQLF5Z/p3/CyvbQlk2beq79gqZx14su+Su4r4j818+MlRVhFGDw5PzkrlLK75weVpMQ5/qUJZNPzsx3W1oetC7wpRZZb+ <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function indexFromHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return 0;
    if (/^\d+$/.test(raw) && +raw < DATA.tutorials.length) return +raw;
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === raw || t.meta.name === raw
    );
    return i >= 0 ? i : 0;
  }
  function show(idx) { picker.value = idx; render(idx); }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    render(+picker.value);
  });
  window.addEventListener("hashchange", () => show(indexFromHash()));
  show(indexFromHash());
</script>
