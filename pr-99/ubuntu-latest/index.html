<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
    --pass: #2ea043; --fail: #f85149; --info: #d29922;
    --code-bg: #0b0f14;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--border); padding: 12px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.pass { background: rgba(46,160,67,.15); color: var(--pass); }
  .pill.fail { background: rgba(248,81,73,.15); color: var(--fail); }
  .pill.skip { background: rgba(210,153,34,.15); color: var(--info); }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
  main { max-width: 1600px; margin: 0 auto; padding: 16px; }
  .tutorial-title { font-size: 20px; font-weight: 700; margin: 24px 0 8px; color: #fff; }
  .row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    border: 1px solid var(--border); border-radius: 8px; margin: 10px 0; overflow: hidden;
  }
  .row.preamble, .row.section { grid-template-columns: 1fr; }
  .col { padding: 14px 18px; min-width: 0; }
  .col.left { border-right: 1px solid var(--border); }
  .row.preamble .col.left, .row.section .col.left { border-right: none; }
  .col.right { background: var(--panel); }
  /* A row containing any failed step is tinted red end-to-end so it's
     impossible to miss when scanning the report. */
  .row.has-fail { border-color: var(--fail); box-shadow: 0 0 0 1px var(--fail); }
  .row.has-fail .col.left { background: rgba(248,81,73,.07); border-right-color: var(--fail); }
  .row.has-fail .col.right { background: rgba(248,81,73,.12); }
  .col-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
  .md :first-child { margin-top: 0; }
  .md h1 { font-size: 22px; } .md h2 { font-size: 18px; } .md h3 { font-size: 15px; }
  .md pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; }
  .md code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .md :not(pre) > code { background: rgba(110,118,129,.2); padding: .15em .4em; border-radius: 4px; }
  .md table { border-collapse: collapse; margin: 8px 0; }
  .md th, .md td { border: 1px solid var(--border); padding: 5px 10px; }
  .md blockquote { border-left: 3px solid var(--border); margin: 8px 0; padding: 2px 12px; color: var(--muted); }
  .md img { width: 100%; height: auto; border: 1px solid var(--border); border-radius: 6px; }
  .exec { margin-bottom: 14px; }
  .exec:last-child { margin-bottom: 0; }
  .exec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 4px; }
  .badge.pass { background: rgba(46,160,67,.15); color: var(--pass); }
  .badge.fail { background: rgba(248,81,73,.15); color: var(--fail); }
  .badge.info { background: rgba(210,153,34,.15); color: var(--info); }
  .kind { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .note { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
  pre.cmd { background: var(--code-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 12px; margin: 0 0 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  pre.output { background: #010409; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin: 0; overflow-x: auto; max-height: 360px; overflow-y: auto; color: #b9c1ca; }
  pre.cmd, pre.output { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.45; }
  .empty { color: var(--muted); font-style: italic; font-size: 12.5px; }
  details summary { cursor: pointer; color: var(--accent); font-size: 12px; margin-bottom: 4px; }
  /* GitHub-style permalinks: every heading carries a link icon in the left
     gutter (revealed on hover/focus) that copies a deep link to that section.
     scroll-margin-top keeps the target clear of the sticky header. */
  .heading-anchored { position: relative; scroll-margin-top: 76px; }
  a.anchor {
    position: absolute; left: -18px; top: 0; width: 16px; height: 1.55em;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); opacity: 0; text-decoration: none;
    transition: opacity .1s ease-in;
  }
  a.anchor svg { width: 14px; height: 14px; display: block; }
  .heading-anchored:hover > a.anchor, a.anchor:focus { opacity: 1; }
  a.anchor:hover { color: var(--accent); }
  .heading-anchored.flash { animation: flash 1.4s ease-out; border-radius: 4px; }
  @keyframes flash {
    from { background: rgba(88,166,255,.28); box-shadow: 0 0 0 4px rgba(88,166,255,.28); }
    to { background: transparent; box-shadow: 0 0 0 4px transparent; }
  }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 7px 14px; font-size: 12.5px; z-index: 20;
    opacity: 0; pointer-events: none; transition: opacity .15s ease-in-out;
  }
  #toast.show { opacity: 1; }
</style>

<script id="report-data" type="application/json">{"generated_platform": "Linux", "summary": {"failed": 0, "passed": 4, "skipped": 0}, "tutorials": [{"meta": {"name": "Tutorial: The Logos Chat UI", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Tutorial: The Logos Chat UI\n\n`chat_ui` is a Logos **UI module**: a QML view backed by a small C++ class\n(the *universal* typed-backend authoring model) that drives the Rust\n`chat_module` \u2014 end-to-end-encrypted conversations carried over\n`delivery_module`. You write a `.rep` view contract and a `*Backend` deriving\n`LogosUiPluginContext`; the plugin glue, the typed `modules().chat_module`\ncaller, and the QtRO wiring are generated.\n\nThis tour builds the app, watches it connect to the network, and shares your\naddress (what a peer needs to start a conversation with you).\n\n> **The two-party exchange has its own tutorial.** A message exchange is\n> inherently two-party, so it gets its own walkthrough \u2014 *Run the automated\n> message-exchange test* \u2014 which drives the real round-trip between two windows\n> and shows the result, with the step-by-step flow in\n> [docs/two-instance-exchange.md](../docs/two-instance-exchange.md). This\n> tutorial covers everything a single window shows: connecting, and sharing\n> your own address.\n\n**What you'll build:** A running Logos chat app, connected to the network and sharing your address from the GUI.\n\n**What you'll learn:**\n\n- How a `type: ui_qml`, `interface: universal` module is built and run\n- The connection lifecycle: init is non-blocking and the UI goes Online when delivery connects\n- Sharing your address \u2014 what a peer needs to open an encrypted conversation with you\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, Rust) during the builds.\n- **Network access.** The delivery node connects over the configured network preset; an isolated sandbox never goes Online."}, {"execs": [], "md": "## Step 1: Build the chat UI\n\nThe module builds with the standard `mkLogosQmlModule` flake output \u2014\n`chat_ui_plugin.so` (the C++ backend + generated glue) and\n`chat_ui_replica_factory.so` (the QtRO replica for the QML view)."}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-chat-ui/a61010cc5cfed1ff973e035e8d3b6864a7668e6c' -o result", "exit_code": 0, "kind": "run", "note": "", "output": "warning: ignoring untrusted flake configuration setting 'extra-substituters'.\nPass '--accept-flake-config' to trust it\nwarning: ignoring untrusted flake configuration setting 'extra-trusted-public-keys'.\nPass '--accept-flake-config' to trust it\n", "status": "pass"}], "md": "### 1.1 Build the plugin\n\n```bash\nnix build 'github:logos-co/logos-chat-ui'\n```\n\nThe build runs the universal UI codegen (`logos-qt-generator --backend\nui`) over `src/ChatBackend.rep`, compiles `ChatBackend` (which derives\n`ChatBackendSimpleSource` + `LogosUiPluginContext`), and emits the\n`chat_ui_plugin` / replica-factory glue around it."}, {"execs": [], "md": "## What the chat UI does\n\nThe window is a two-pane messenger:\n\n- **Left:** your conversations, under a **New chat** button (start a\n  direct message from someone's address, or a group), with your own\n  account card at the foot: your name, or a link to add one, beside the\n  address's short form, the delivery state\n  (`Stopped` \u2192 `Initialising...` \u2192 `Online`), and your address with a\n  copy button beside it.\n- **Right:** the message thread for the selected conversation, under a\n  header carrying its avatar, its description and who is in it, and a\n  composer with the send action at its end.\n\nUnder the hood the backend calls `modules().chat_module` \u2014 typed methods\n(`init`, `get_address`, `set_display_name`, `create_conversation`,\n`send_message`, \u2026)\nand string-keyed event subscriptions (`message_received`,\n`delivery_state_changed`, \u2026) that push updates into the view with no\npolling. `init` kicks off the delivery node asynchronously and returns\nimmediately; the UI flips to **Online** when the\n`delivery_state_changed` event reports the network is up."}, {"execs": [], "md": "## Step 2: Launch and connect, name your account, then share your address\n\nRun the app headless (offscreen Qt) and drive it: wait for the network to\ncome up, name your account, then copy your address \u2014 the\neverything-a-single-window-shows half of the tour. The app gets a session\ndirectory of its own in the doc-test's work directory, so each run starts\nwith a new account."}, {"execs": [{"cmd": "nix run 'github:logos-co/logos-chat-ui/a61010cc5cfed1ff973e035e8d3b6864a7668e6c' -- --user-dir ./chat-user\n\n# test actions:\n- Window opens: wait for ['New chat']\n- Network connects: wait for ['Online']\n- Add your name: click objectName='addNameLink'\n- Type it: set objectName='nameField' to ' Saro '\n- Save it: click objectName='saveNameButton'\n- Name published: wait for ['Saro']\n- Copy your address: click objectName='copyMyAddressButton'\n- Copied confirmation: wait for ['Copied to clipboard']", "kind": "ui_test", "note": "", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m Tutorial: The Logos Chat UI: Drive the app\n\n1 passed, 0 failed\n\n", "status": "pass"}], "md": "### 2.1 Drive the app\n\n```bash\nnix run 'github:logos-co/logos-chat-ui/a61010cc5cfed1ff973e035e8d3b6864a7668e6c' -- --user-dir ./chat-user\n```\n\nThe chat window opens; the account card starts at **Stopped** while delivery boots.\n\n`init` returned right away and the delivery node bootstrapped in\nthe background. When it connects, the `delivery_state_changed`\nevent lands and the state flips to **Online** \u2014 **New chat**\nenables and the backend reads `get_a sation takes two people: one shares their address, the other pastes\nit into **New DM**, sends a first message, and the reply flows back. That\nround-trip spans **two** app instances, so the single-window walkthrough in\n*The Logos Chat UI* tutorial can't express it \u2014 and neither can the doc-test\n`ui_test` driver on its own, which works against one instance and can only set\nliteral field values (it can't read one window's address out and paste it\ninto another).\n\n`logos-chat-ui` ships an automated test for exactly this. The `exchange` app\ndrives the real two-party round-trip over the live network between two headless\ninstances, then exposes the receiving window so the finished thread can be\ncaptured. This tutorial runs that test and shows its result; the full\nstep-by-step flow \u2014 address, first message, reply \u2014 with screenshots of **both**\nwindows is in\n[docs/two-instance-exchange.md](../docs/two-instance-exchange.md).\n\n**What you'll build:** A verified end-to-end message round-trip between two chat UI instances, captured from the receiving window.\n\n**What you'll learn:**\n\n- How the `exchange` app runs the full two-party round-trip headless over the live network\n- Why a two-window exchange needs a dedicated runner rather than the single-instance `ui_test` driver\n- Where the step-by-step, both-windows walkthrough and its regeneration script live\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, Rust) during the builds.\n- **Network access.** The two delivery nodes discover each other over the configured network preset; an isolated sandbox won't complete the exchange."}, {"execs": [], "md": "## Step 1: Run the automated exchange\n\nThe `exchange` app launches two instances offscreen and runs the real\nround-trip over the live network \u2014 Alice shares her address, Bob opens a\nconversation with it and, once she joins, sends the first message, Alice\nreplies \u2014 then opens the capture port onto the live receiving window so\nthe finished thread is on screen. The whole round-trip happens while the\nlaunch is still coming up, so the screenshot below captures the\nalready-completed conversation."}, {"execs": [{"cmd": "nix run 'github:logos-co/logos-chat-ui/a61010cc5cfed1ff973e035e8d3b6864a7668e6c#exchange'\n\n# test actions:\n- Round-trip complete: wait for [\"Hi Alice, it's Bob \ud83d\udc4b\", 'Hi Bob, got it']", "kind": "ui_test", "note": "", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m Tutorial: Run the automated message-exchange test: Run the round-trip and show the result\n\n1 passed, 0 failed\n\n", "status": "pass"}], "md": "### 1.1 Run the round-trip and show the result\n\n```bash\nnix run 'github:logos-co/logos-chat-ui/a61010cc5cfed1ff973e035e8d3b6864a7668e6c#exchange'\n```\n\nThe receiving window after the round-trip: the peer's opening\nmessage and the reply, each end-to-end-encrypted and carried over\n`delivery_module`. The same exchange, step by step across both\nwindows, is in\n[docs/two-instance-exchange.md](../docs/two-instance-exchange.md).\n\n![Round-trip complete](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdeXwU5eH48Wdmdje7uTYnOTgiQrgPkVsEAUELyqFQTMGjSG2pV/tTW9t+W+3Lrz0UW8SbfqvigfWiqCA3CIrhVOS+jwAhCTkIufae+f0xNqYcySbZbBKfz/uVV1+bycyzT2i3mc/OsUpSUpIAAAAAIAe1uScAAAAAIHwIAAAAAEAiBAAAAAAgEQIAAAAAkAgBAAAAAEiEAAAAAAAkQgAAAAAAEiEAAAAAAIkQAAAAAIBECAAAAABAIgQAAAAAIBFLSEax2+2RkZFWq1XTNIvFoihKSIYFcDHDMPx+fyAQ8Pl8VVVVbrc7DE/KaxwAgGbRFH/3laSkpAZvrGlaXFxcZGRkIBBwu91+v1/X9UAgYBhG42cG4JIURdE0TVVVi8Vit9s1TauqqiotLQ0EAiF/rurXuN/vd7lcXq9X13W/389rHACA8FAUxWKxqKpqs9kcDofFYmn83/0GBoCiKE6nMyYmxuVyVVVV6bre4BkAaAxVVSMjIx0OR3l5+fnz50O1a179Gq+srCwvL+c1DgBAS6CqakxMT UVORK5CYII=)"}]}, {"meta": {"name": "Tutorial: Run the automated group-chat test", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Tutorial: Run the automated group-chat test\n\nA group conversation goes further than a DM: one person creates it,\ninvites others by address, and every message fans out to the whole roster with\nthe sender attributed. That spans **three** app instances and grows by\nmembership commits over the live network \u2014 more than the single-window\nwalkthrough in *The Logos Chat UI* tutorial can express, and more than the\ndoc-test `ui_test` driver can orchestrate on its own (it works against one\ninstance and can't read one window's address out to invite it into another).\n\n`logos-chat-ui` ships an automated test for exactly this. The `group` app\ndrives the real three-party flow over the live network between three headless\ninstances \u2014 Alice creates the group, invites Bob and Carol, and once the roster\nconverges sends a message that reaches both. Then Carol misses a message and\ngets it back from a Store node. The app then exposes Carol's window so the\nfinished group can be captured.\n\n**What you'll build:** A verified three-member, end-to-end-encrypted group conversation across three chat UI instances, captured from a receiving member's window.\n\n**What you'll learn:**\n\n- How the `group` app forms a three-member group and fans a message out to it, headless over the live network\n- How the group UI adds a members pane and per-message sender attribution over a DM\n- How a member who missed a message fetches it from Store once a later message names it\n- Why a multi-window group needs a dedicated runner rather than the single-instance `ui_test` driver\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, Rust) during the builds.\n- **Network access.** The three delivery nodes discover each other over the configured network preset; an isolated sandbox won't complete the flow. Expect membership changes to take minutes."}, {"execs": [], "md": "## Step 1: Run the automated group chat\n\nThe `group` app launches three instances offscreen and runs the real flow\nover the live network \u2014 each names its account, Alice creates the group,\ninvites Bob and Carol, and once all three are in she sends a message that\nfans out to both.\n\nThen Carol misses one. The flow has her delivery node drop the group's\ntopic while Alice sends \"Next pick: Dune\", so the message never reaches\nher live, and subscribes again 35 seconds later. Bob's reply, \"Count me\nin\", names Alice's message, so Carol's Chat sees a gap and fetches the\nmessage from a Store node of the delivery network.\n\nLast, the flow reads the group's debug data in each window, what the\ndeveloper tools' State tab shows, and checks that all three report the\nsame epoch and fingerprint.\n\nThe app then opens the capture port onto Carol's live window. The whole\nflow happens while the launch is still coming up, so the screenshot below\ncaptures the finished group: all three messages, each under its sender's\nname, beside the three-member roster."}, {"execs": [{"cmd": "nix run 'github:logos-co/logos-chat-ui/a61010cc5cfed1ff973e035e8d3b6864a7668e6c#group'\n\n# test actions:\n- Group message received: wait for ['Hello team \ud83d\udc4b', 'Next pick: Dune', 'Count me in', 'Members']", "kind": "ui_test", "note": "", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m Tutorial: Run the automated group-chat test: Run the group flow and show the result\n\n1 passed, 0 failed\n\n", "status": "pass"}], "md": "### 1.1 Run the group flow and show the result\n\n```bash\nnix run 'github:logos-co/logos-chat-ui/a61010cc5cfed1ff973e035e8d3b6864a7668e6c#group'\n```\n\nCarol's window after the group formed: Alice's two messages and\nBob's reply, received under their senders' names and\nend-to-end-encrypted over `delivery_module`, beside the members\npane listing the three-member roster. \"Next pick: Dune\" came\nfrom Store.\n\n![Group message received](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdd1hT5/4A8PfknGySkDBlqsgQBTeKdW+LilpnW6v21qtV621tr923/fXW9tbbammr1lFtrbbOuvfCDYgoQ6aA7LATIGSd8fvj2NwUMAQIS76f5zx9Due853vexCZ53/MuzNHREQEAAAAAAAC6Bk57ZwAAAAAAAADQdqACAAAAAAAAQBcCFQAAAAAAAAC6EKgAAAAAAAAA0IVABQAAAAAAAIAuBCoAAAAAAAAAdCFQAQAAAAAAAKALgQoAAAAAAAAAXQhUAAAAAAAAAOhCoAIAAAAAAABAFwIVAAAAAAAAALoQwiZRBAKBSCTicrk4jhMEgWGYTcICAOpjGIYkSYqijEZjbW2tTqdrg5vCZxwAUAd8FwHQNlrjs4Y5Ojo2+2Icx+3t7UUiEUVROp2OJEmapimKYhim5TkDADQIwzAcxzkcDkEQAoEAx/Ha2lqVSkVRlM3vZfqMkySp1WoNBgNN0yRJwmccAIBhGEEQHA6Hx+MJhUKCINrguwjKG6ALao3f/WZWADAMk8lkEolEq9XW1tbSNN3sHAAAWoLD4YhEIqFQWF1drVarbfVzaPqMazSa6upq+IwDACzjcDgSiUQsFrfSdxGUNwBg2eR3vzkVABzHnZycGIaBYgEAHQT704thWGlpacsfv7GfcZqmW+lhHgDgWcU+qudwODb8LoLyBgD1tfB3HxeJRE26gMvlurq66vX66upqaHoDoINgGEav1+M4LpfLtVptS34p2c8427wIn3EAQJMwDKPVanEcd3BwsMl3EZQ3AGhQC3/3m1YBwHHcxcVFo9Fotdom5hMA0OqMRiNN0wqFQqPRNO/3kv2Mq9VqjUZj8+wBALoIg8FAUZSjo2MLv4ugvAGAZc3+3W9CBQDDMGdnZ4PBAJ9GADoskiQxDGP77jf1WvYzrtVqofQPAGgh9rtIJpM1+7sIyhsAWKN5v/tNWAdAJpMxDAMlAwA6OPYxgEwma+qFMpmMpunq6urWyBUAoKthO+4377sIyhsAWK8Zv/vWVgBwHJdIJFAyAKBTqK6ulkgkOI5bfwn7GVepVK2XKwBAV6NSqZr3XQTlDQCapKm/+9Z2AVIoFCRJ6vX6FuQNANBGGIbhcDgCgcD6BnSFQgEN7gAA22K/i4RCYZO+i6C8AUBTNfV336oWAAzDRCJRbW1ty/IGAGg7tbW1TRrhIxKJ4JEbAMDmqqurm/pdBOUNAJqhSb/7VlUA+Hw+RVEwBS8AnQi7TKZAILAmMZ/PZ1fWbO1cAQC6GpqmjUaj9d9FUN4AoHma9LtPWJNIJBLpdDrrc+ArF8/2dQl1s3cV84VEE3r+AQAapCUppUZ/p1D1R0ZxRqW1A+N0Op2VH16RSASdfwAAraRJ30VNKm8AAMxZ/1mzqgLA5XKtLBzwONg/Q3zm+rti1qQGAFhHSOA9ZKIeMtHC3m6H0pT/jck00I1P90uSpFAotCY+l8uF/j8AgFZiMBgkEok1Ka0vbwAA6rP+d9+qCgCO49a0x/E42JaJfYe4NnnCLwCAlTCE5vm79pAJV15MarQOQNO0lRMCWPkZBwCAZqAoCr6LAGgD1v/uW1UBIAiCoqhGk/0zxAdK/w <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
